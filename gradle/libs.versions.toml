[versions]
kotlin = "1.7.3"
aws = "2.30.22"
jackson = "2.18.3"
dagger = "2.54"
mockk = "1.13.16"
junit = "5.10.1"
okhttp = "4.12.0"

[libraries]
# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin" }

# Lambda events
lambda-core = { module = "com.amazonaws:aws-lambda-java-core", version = "1.2.3" }
lambda-events = { module = "com.amazonaws:aws-lambda-java-events", version = "3.11.3" }

# AWS SDK services
aws-secretsmanager = { module = "software.amazon.awssdk:secretsmanager", version.ref = "aws" }
aws-core = { module = "software.amazon.awssdk:aws-core", version.ref = "aws" }
aws-regions = { module = "software.amazon.awssdk:regions", version.ref = "aws" }
aws-sdk-core = { module = "software.amazon.awssdk:sdk-core", version.ref = "aws" }
aws-sdk-utils = { module = "software.amazon.awssdk:utils", version.ref = "aws" }

aws-s3 = { module = "software.amazon.awssdk:s3", version.ref = "aws" }
aws-dynamodb = { module = "software.amazon.awssdk:dynamodb", version.ref = "aws" }
aws-dynamodb-enhanced = { module = "software.amazon.awssdk:dynamodb-enhanced", version.ref = "aws" }
aws-sqs = { module = "software.amazon.awssdk:sqs", version.ref = "aws" }
aws-cognito = { module = "software.amazon.awssdk:cognitoidentityprovider", version.ref = "aws" }
aws-utils = { module = "software.amazon.awssdk:utils", version.ref = "aws" }

# Jackson
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson" }

# Logging
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version = "7.0.0" }
slf4j = { module = "org.slf4j:slf4j-simple", version = "2.0.3" }
log4j = { module = "org.apache.logging.log4j:log4j-core", version="2.20.0" }

# Injection
dagger = { module = "com.google.dagger:dagger", version.ref = "dagger" }
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
javax-inject = { module = "javax.inject:javax.inject", version = "1" }

# Plaid
plaid = { module = "com.plaid:plaid-java", version = "30.1.0" }

# Auth0
auth0 = { module = "com.auth0:auth0", version = "2.18.0" }

# Testing
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version = "2.1.10"}
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockk-dsl = { module = "io.mockk:mockk-dsl", version.ref = "mockk" }
junit-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

# Http
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp" }

[plugins]
jvm = { id = "org.jetbrains.kotlin.jvm", version = "2.1.0"}
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version = "1.9.21" }
ksp = { id = "com.google.devtools.ksp", version = "2.1.0-1.0.29" }
openapi = { id = "org.openapi.generator", version = "7.12.0" }
shadow = { id = "com.gradleup.shadow", version = "8.3.6" }
