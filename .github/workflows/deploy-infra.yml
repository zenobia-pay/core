name: DeployInfra

on:
  push:
    branches: 
      - "beta"
      - "prod"
  pull_request:
    branches: 
      - "beta"
      - "prod"
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: write    # This is required for gradle dependency graph and git checkout
jobs:
  build-kotlin:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Build Kotlin artifacts
      run: make kotlin

  build-go:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Go
      run: |
        wget -q https://golang.org/dl/go1.18.5.linux-amd64.tar.gz
        sudo tar -C /usr/local -xzf go1.18.5.linux-amd64.tar.gz
        echo "export PATH=$PATH:/usr/local/go/bin" >> ~/.bashrc
        source ~/.bashrc

    - name: Build Go artifacts
      run: make go

  gradle-dependency-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout sources
      uses: actions/checkout@v4
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v4

  deploy-tf:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
    - uses: actions/checkout@v4
    - name: Configure aws credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: arn:aws:iam::039319543506:role/GithubActionsRole
        role-session-name: github-actions-${{ github.workflow }}-${{ github.run_id }}
        aws-region: us-east-1
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Terraform Init
      run: |
        terraform init \
        -backend-config="bucket=zenobia-terraform-bucket" \
        -backend-config="key=envs/${GITHUB_REF_NAME}/terraform.tfstate" \
        -backend-config="region=us-east-1"
      working-directory: terraform
    - name: Terraform Plan
      run: terraform plan
      working-directory: terraform
      env:
        TF_VAR_AUTH0_DOMAIN: ${{ vars.TF_VAR_AUTH0_DOMAIN}}
        TF_VAR_AUTH0_CLIENT_ID: ${{ secrets.TF_VAR_AUTH0_CLIENT_ID }}
        TF_VAR_AUTH0_CLIENT_SECRET: ${{ secrets.TF_VAR_AUTH0_CLIENT_SECRET }}
        TF_VAR_ZENOBIA_ENDPOINT: ${{ vars.TF_VAR_ZENOBIA_ENDPOINT}}
    - name: Terraform Apply
      run: terraform apply -auto-approve
      working-directory: terraform
      env:
        TF_VAR_AUTH0_DOMAIN: ${{ vars.TF_VAR_AUTH0_DOMAIN}}
        TF_VAR_AUTH0_CLIENT_ID: ${{ secrets.TF_VAR_AUTH0_CLIENT_ID }}
        TF_VAR_AUTH0_CLIENT_SECRET: ${{ secrets.TF_VAR_AUTH0_CLIENT_SECRET }}
        TF_VAR_ZENOBIA_ENDPOINT: ${{ vars.TF_VAR_ZENOBIA_ENDPOINT}}

  deploy-aws:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
      AUTH0_SECRETS_ARN: ${{ vars.AUTH0_SECRETS_ARN }}
      ORUM_SECRETS_ARN: ${{ vars.ORUM_SECRETS_ARN }}
      PLAID_SECRETS_ARN: ${{ vars.PLAID_SECRETS_ARN }}
      ORUM_PUBLIC_CERTIFICATE: ${{ vars.ORUM_PUBLIC_CERTIFICATE }}
      ORUM_IP_ADDRESSES: ${{ vars.ORUM_IP_ADDRESSES }}
      ORUM_SLACK_WEBHOOK: ${{ vars.ORUM_SLACK_WEBHOOK }}
      WEBSOCKET_SERVICE_ENDPOINT: ${{ vars.WEBSOCKET_SERVICE_ENDPOINT }}
      ZENOBIA_API_ENDPOINT: ${{ vars.ZENOBIA_API_ENDPOINT }}
      PLAID_IP_ADDRESSES: ${{ vars.PLAID_IP_ADDRESSES }}
      PLAID_SLACK_WEBHOOK: ${{ vars.PLAID_SLACK_WEBHOOK }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v3
    - uses: aws-actions/setup-sam@v2
    - name: Configure aws credentials
      uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
      with:
        role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        role-session-name: github-actions-${{ github.workflow }}-${{ github.run_id }}
        aws-region: us-east-1

    - name: Install Go
      run: |
        wget -q https://golang.org/dl/go1.18.5.linux-amd64.tar.gz
        sudo tar -C /usr/local -xzf go1.18.5.linux-amd64.tar.gz
        echo "export PATH=$PATH:/usr/local/go/bin" >> ~/.bashrc
        source ~/.bashrc

    - name: Build Go artifacts
      run: make go
    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Build Kotlin artifacts
      run: make kotlin
    - name: Deploy sam
      run: |
        sam deploy --no-confirm-changeset \
          --parameter-overrides \
          Stage=beta \
          PlaidSecretsArn=$PLAID_SECRETS_ARN \
          OrumSecretsArn=$ORUM_SECRETS_ARN \
          Auth0SecretsArn=$AUTH0_SECRETS_ARN \
          Auth0Domain=$AUTH0_DOMAIN \
          OrumPublicCertificate=$ORUM_PUBLIC_CERTIFICATE \
          OrumIpAddresses=$ORUM_IP_ADDRESSES \
          OrumSlackWebhook=$ORUM_SLACK_WEBHOOK\
          WebsocketServiceEndpoint=$WEBSOCKET_SERVICE_ENDPOINT \
          ZenobiaApiEndpoint=$ZENOBIA_API_ENDPOINT \
          PlaidIpAddresses=$PLAID_IP_ADDRESSES \
          PlaidSlackWebhook=$PLAID_SLACK_WEBHOOK