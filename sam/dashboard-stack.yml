AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Dashboard stack.

Resources:
  ZenobiaDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
        DashboardName: ZenobiaServiceDashboard
        DashboardBody:
            Fn::Sub: |
                {
                "widgets": [
                    {
                        "height": 6,
                        "width": 12,
                        "y": 5,
                        "x": 0,
                        "type": "metric",
                        "properties": {
                            "metrics": [
                                [ { "expression": "100 * (1 - (m1 / m2))", "label": "Availability", "id": "e1", "region": "us-east-1" } ],
                                [ "AWS/ApiGateway", "5XXError", "ApiName", "Zenobia API", { "region": "us-east-1", "id": "m1", "visible": false } ],
                                [ ".", "Count", ".", ".", { "id": "m2", "visible": false, "region": "us-east-1" } ]
                            ],
                            "view": "timeSeries",
                            "stacked": false,
                            "region": "us-east-1",
                            "stat": "Sum",
                            "period": 300,
                            "title": "Availability (5xx)",
                            "yAxis": {
                                "left": {
                                    "max": 100,
                                    "label": ""
                                }
                            }
                        }
                    },
                    {
                        "height": 6,
                        "width": 11,
                        "y": 5,
                        "x": 12,
                        "type": "metric",
                        "properties": {
                            "metrics": [
                                [ { "expression": "100 * (1 - (m1 / m2))", "label": "4xx Availability", "id": "e1", "region": "us-east-1" } ],
                                [ "AWS/ApiGateway", "4XXError", "ApiName", "Zenobia API", { "region": "us-east-1", "id": "m1", "visible": false } ],
                                [ ".", "Count", ".", ".", { "id": "m2", "visible": false, "region": "us-east-1" } ]
                            ],
                            "view": "timeSeries",
                            "stacked": false,
                            "region": "us-east-1",
                            "stat": "Sum",
                            "period": 300,
                            "title": "Success Rate (4xx)",
                            "yAxis": {
                                "left": {
                                    "max": 100
                                }
                            }
                        }
                    },
                    {
                        "height": 5,
                        "width": 12,
                        "y": 11,
                        "x": 0,
                        "type": "log",
                        "properties": {
                            "query": "SOURCE '/aws/api-gateway/zenobia-access-logs' | fields @timestamp, @message, @logStream, @log\n| filter status >= 500\n| stats count(*) as count by path, status\n| sort count desc\n| limit 10000",
                            "region": "us-east-1",
                            "stacked": false,
                            "view": "table",
                            "title": "5xx by path"
                        }
                    },
                    {
                        "height": 5,
                        "width": 11,
                        "y": 11,
                        "x": 12,
                        "type": "log",
                        "properties": {
                            "query": "SOURCE '/aws/api-gateway/zenobia-access-logs' | fields @timestamp, @message, @logStream, @log\n| filter status >= 400 and status < 500\n| stats count(*) as count by path, status\n| sort count desc\n| limit 10000",
                            "region": "us-east-1",
                            "stacked": false,
                            "view": "table",
                            "title": "4xx by path"
                        }
                    },
                    {
                        "height": 3,
                        "width": 23,
                        "y": 1,
                        "x": 0,
                        "type": "metric",
                        "properties": {
                            "metrics": [
                                [ { "expression": "m1 / 100", "label": "Daily Total Amount Processed", "id": "e2" } ],
                                [ { "expression": "m2 / 100", "label": "Daily Fees Collected", "id": "e1" } ],
                                [ "PayoutProcessor", "TotalPayout", { "id": "m1", "visible": false, "period": 86400 } ],
                                [ ".", "FeeCollected", { "period": 86400, "id": "m2", "visible": false } ]
                            ],
                            "sparkline": true,
                            "view": "singleValue",
                            "region": "us-east-1",
                            "stat": "Sum",
                            "period": 300,
                            "singleValueFullPrecision": true,
                            "stacked": false,
                            "title": "Zenobia Spending"
                        }
                    },
                    {
                        "height": 1,
                        "width": 23,
                        "y": 0,
                        "x": 0,
                        "type": "text",
                        "properties": {
                            "markdown": "# Zenobia Pay Revenue \n"
                        }
                    },
                    {
                        "height": 1,
                        "width": 23,
                        "y": 4,
                        "x": 0,
                        "type": "text",
                        "properties": {
                            "markdown": "# API Service Metrics"
                        }
                    }
                ]
                }
