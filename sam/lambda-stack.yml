AWSTemplateFormatVersion: "2010-09-09"
Transform: "AWS::Serverless-2016-10-31"
Description: Stack to store Lambda handlers

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: java17
    Architectures:
      - x86_64
    AutoPublishAlias: prod
    SnapStart:
      ApplyOn: PublishedVersions
    AutoPublishAliasAllProperties: true
    VpcConfig:
      SecurityGroupIds:
        - !Ref SecurityGroupId
      SubnetIds:
        - !Ref SubnetId1
        - !Ref SubnetId2

Parameters:
  BankKeyId:
    Type: String
  TransferKeyId:
    Type: String
  UserKeyId:
    Type: String
  BankTableName:
    Type: String
  TransferTableName:
    Type: String
  UserTableName:
    Type: String
  TransferTableStreamArn:
    Type: String
  SecurityGroupId:
    Type: String
  SubnetId1:
    Type: String
  SubnetId2:
    Type: String
  PlaidSecretsArn:
    Type: String
  OrumSecretsArn:
    Type: String
  Auth0SecretsArn:
    Type: String
  Auth0Domain:
    Type: String
    Description: Auth0 domain used for authentication
  OrumPublicCertificate:
    Type: String
    Description: Orum public certificate used for webhook signing
  OrumIpAddresses:
    Type: String
    Description: Valid orum ip addresses to accept requests from. Comma separated.
  OrumSlackWebhook:
    Type: String
    Description: Slack webhook for orum channel

Resources:
  ZenobiaApi:
    Type: AWS::Serverless::Api
    Properties:
      Auth:
        DefaultAuthorizer: ApiAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          ApiAuthorizer:
            FunctionPayloadType: REQUEST
            FunctionArn: !GetAtt CustomAuthorizerFunction.Arn
            Identity:
              Headers:
                - Authorization
          SignatureAuthorizer:
            FunctionPayloadType: REQUEST
            FunctionArn: !GetAtt CustomAuthorizerFunction.Arn
            Identity:
              Headers:
                - Signature
      Cors:
        AllowCredentials: true
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'https://dashboard.zenobiapay.com'"
      StageName: Prod
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: '{"requestId":"$context.requestId","sub":"$context.authorizer.sub","resourcePath": "$context.resourcePath","path":"$context.path","ip":"$context.identity.sourceIp","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","responseLatency":"$context.responseLatency","userAgent":"$context.identity.userAgent","requestTime":"$context.requestTime"}'
      MethodSettings:
        - LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true
          HttpMethod: "*"
          ResourcePath: "/*"
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: Zenobia API
          version: 1.0
        components:
          securitySchemes:
            SignatureAuthorizer:
              type: apiKey
              name: Signature
              in: header
              x-amazon-apigateway-authtype: custom
              x-amazon-apigateway-authorizer:
                type: request
                authorizerUri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomAuthorizerFunction.Arn}/invocations
                identitySource: method.request.header.Signature
          responses:
            BadRequest:
              description: Bad request
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
            Forbidden:
              description: Forbidden
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
            NotFound:
              description: Resource not found
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
            InternalServerError:
              description: Internal server error
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
          schemas:
            ErrorResponse:
              type: object
              properties:
                error:
                  type: string
                message:
                  type: string
            PaymentParticipantIdentity:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
            TransferStatus:
              type: string
              enum:
                - NOT_STARTED
                - IN_FLIGHT
                - COMPLETED
                - FAILED
                - CANCELLED
            StatementItem:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                  minLength: 1
                amount:
                  type: integer
                  minimum: 1
            Location:
              type: object
              properties:
                address:
                  type: string
                  maxLength: 255
                  minLength: 1
                latitude:
                  type: number
                longitude:
                  type: number
            UserType:
              type: string
              enum: [ MERCHANT, CUSTOMER ]
            CertificateType:
              type: string
              enum: [ EC ]
            SignatureType:
              type: string
              enum: [ SHA256_WITH_ECDSA ]
            Address:
              type: object
              required:
                - address1
                - city
                - state
                - country
                - zip5
              properties:
                address1:
                  type: string
                  maxLength: 255
                address2:
                  type: string
                  maxLength: 255
                city:
                  type: string
                  maxLength: 255
                state:
                  type: string
                  maxLength: 255
                country:
                  type: string
                  enum: [ US ]
                zip5:
                  type: string
                  pattern: '^\d{5}$'

        x-amazon-apigateway-request-validators:
          basic:
            validateRequestParameters: true
            validateRequestBody: true
        x-amazon-apigateway-request-validator: basic
        paths:
          /orum-webhook:
            post:
              summary: "Orum webhook endpoint"
              security:
                - SignatureAuthorizer: []
              operationId: "OrumWebhook"
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        created_at:
                          type: string
                        event_id:
                          type: string
                        event_type:
                          type: string
                        event_data:
                          type: object
              responses:
                '200':
                  description: "Successful response"
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebhookHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /create-link-token:
            post:
              summary: "Creates a plaid link token"
              operationId: "CreateLinkToken"
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                        - product
                      properties:
                        product:
                          type: string
                          enum:
                            - AUTH
                            - IDENTITY_VERIFICATION
              responses:
                '200':
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          linkToken:
                            type: string
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BankHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /exchange-token:
            post:
              summary: "Exchanges plaid token"
              operationId: "ExchangeToken"
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        linkToken:
                          type: string
                          maxLength: 255
                        deviceId:
                          type: string
                          maxLength: 255
                        deviceCertificate:
                          type: object
                          properties:
                            certificateType:
                              $ref: "#/components/schemas/CertificateType"
                            certificateValue:
                              type: string
                              maxLength: 3000
                          required:
                            - certificateType
                            - certificateValue
                      required:
                        - linkToken
              responses:
                '200':
                  description: "Successful response"
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-request-validator: body

              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BankHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /list-bank-accounts:
            post:
              summary: "Lists all bank accounts associated with account"
              operationId: "ListBankAccounts"
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        deviceId:
                          type: string
                          maxLength: 255
                          minLength: 1
                        continuationToken:
                          type: string
                          maxLength: 255
              responses:
                '200':
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          continuationToken:
                            type: string
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                bankAccountId:
                                  type: string
                                bankAccountName:
                                  type: string
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BankHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /delete-bank-account:
            post:
              summary: "Deletes a bank account."
              operationId: "DeleteBankAccount"
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                        - bankAccountId
                      properties:
                        deviceId:
                          type: string
                          maxLength: 255
                        bankAccountId:
                          type: string
                          maxLength: 255
                          minLength: 1
              responses:
                '200':
                  description: "Successful response"
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BankHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /create-transfer-request:
            post:
              summary: "Creates a request for payment (merchant side)"
              operationId: "CreateTransferRequest"
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                        - amount
                      properties:
                        amount:
                          type: integer
                          minimum: 0
                          exclusiveMinimum: true
                        statementItems:
                          type: array
                          items:
                            $ref: "#/components/schemas/StatementItem"
              responses:
                '200':
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          transferRequestId:
                            type: string
                          merchantId:
                            type: string
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /fulfill-transfer:
            post:
              summary: "Fulfill transfer request (customer side)"
              operationId: "FulfillTransfer"
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                        - transferRequestId
                        - merchantId
                        - bankAccountId
                        - deviceId
                        - signature
                      properties:
                        transferRequestId:
                          type: string
                          maxLength: 255
                        merchantId:
                          type: string
                          maxLength: 255
                        bankAccountId:
                          type: string
                          maxLength: 255
                        deviceId:
                          type: string
                          maxLength: 255
                        signature:
                          type: object
                          properties:
                            signatureType:
                              $ref: "#/components/schemas/SignatureType"
                            signatureValue:
                              maxLength: 1000
                              type: string
                          required:
                            - signatureType
                            - signatureValue
              responses:
                '200':
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          amount:
                            type: integer
                          merchant:
                            $ref: "#/components/schemas/PaymentParticipantIdentity"
                          statementItems:
                            type: array
                            items:
                              $ref: "#/components/schemas/StatementItem"
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"

              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /get-customer-transfer:
            get:
              summary: "Fetches metadata associated with a merchant's transfer request"
              operationId: "GetCustomerTransfer"
              parameters:
                - name: id
                  in: query
                  required: true
                  schema:
                    type: string
                    minLength: 1
                    maxLength: 256
              responses:
                '200':
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          transferRequestId:
                            type: string
                          merchant:
                            $ref: "#/components/schemas/PaymentParticipantIdentity"
                          status:
                            $ref: "#/components/schemas/TransferStatus"
                          statementItems:
                            type: array
                            items:
                              $ref: "#/components/schemas/StatementItem"
                          statusMessage:
                            type: string
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"

              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /get-merchant-transfer:
            get:
              summary: "Fetches metadata associated with a merchant's transfer request"
              operationId: "GetMerchantTransfer"
              parameters:
                - name: id
                  in: query
                  required: true
                  schema:
                    type: string
                    minLength: 1
                    maxLength: 256
              responses:
                '200':
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          transferRequestId:
                            type: string
                          status:
                            $ref: "#/components/schemas/TransferStatus"
                          statementItems:
                            type: array
                            items:
                              $ref: "#/components/schemas/StatementItem"
                          statusMessage:
                            type: string
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"

              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /list-customer-transfers:
            post:
              summary: "Lists all transfers made with customer account"
              operationId: "ListCustomerTransfers"
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        continuationToken:
                          type: string
                          minLength: 1
                          maxLength: 256
              responses:
                '200':
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          continuationToken:
                            type: string
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                amount:
                                  type: integer
                                creationTime:
                                  type: string
                                status:
                                  $ref: "#/components/schemas/TransferStatus"
                                merchant:
                                  $ref: "#/components/schemas/PaymentParticipantIdentity"
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"

              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /list-merchant-transfers:
            post:
              summary: "Lists all transfers made to a merchant account"
              operationId: "ListMerchantTransfers"
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        continuationToken:
                          type: string
                          minLength: 1
                          maxLength: 256
              responses:
                '200':
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          continuationToken:
                            type: string
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                amount:
                                  type: integer
                                status:
                                  type: string
                                transferRequestId:
                                  type: string
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /list-merchant-payouts:
            post:
              summary: "Lists all payouts for a merchant"
              operationId: "ListMerchantPayouts"
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        continuationToken:
                          type: string
                          minLength: 1
                          maxLength: 256
              responses:
                '200':
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          continuationToken:
                            type: string
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                amount:
                                  type: integer
                                fee:
                                  type: integer
                                status:
                                  type: string
                                  enum:
                                    - PENDING
                                    - PAID
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"

              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /get-merchant-config:
            get:
              summary: "Fetches metadata associated with a merchant"
              operationId: "GetMerchantConfig"
              responses:
                '200':
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          bankAccountId:
                            type: string
                          merchantDisplayName:
                            type: string
                          merchantDescription:
                            type: string
                          webhookUrl:
                            type: string
                          merchantLocation:
                            $ref: "#/components/schemas/Location"
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /update-merchant-config:
            post:
              summary: "Update merchant configuration"
              operationId: "UpdateMerchantConfig"
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        bankAccountId:
                          type: string
                          minLength: 1
                          maxLength: 256
                        merchantDisplayName:
                          type: string
                          minLength: 1
                          maxLength: 256
                        merchantDescription:
                          type: string
                          minLength: 1
                          maxLength: 256
                        webhookUrl:
                          type: string
                          pattern: '^https://.*$'
                          maxLength: 1000
                        merchantLocation:
                          $ref: "#/components/schemas/Location"
              responses:
                '200':
                  description: "Successful response"
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /submit-customer-onboarding:
            post:
              summary: "Onboards a customer, adding user metadata. Only called on first login."
              operationId: "SubmitCustomerOnboarding"
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                        - identityVerificationId
                      properties:
                        identityVerificationId:
                          type: string
                          minLength: 1
                          maxLength: 256
              responses:
                '200':
                  description: "Successful response"
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /submit-merchant-onboarding:
            post:
              summary: "Onboards a merchant, adding user metadata and merchant info. Only called on first login."
              operationId: "SubmitMerchantOnboarding"
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                        - firstName
                        - lastName
                        - merchantDisplayName
                        - legalBusinessName
                        - entityType
                        - taxId
                        - taxIdType
                        - incorporationDate
                        - address
                      properties:
                        firstName:
                          type: string
                          minLength: 1
                          maxLength: 256
                        lastName:
                          type: string
                          minLength: 1
                          maxLength: 256
                        merchantDisplayName:
                          type: string
                          minLength: 1
                          maxLength: 256
                        legalBusinessName:
                          type: string
                          minLength: 1
                          maxLength: 256
                        entityType:
                          type: string
                          enum:
                            - SOLE_PROPRIETORSHIP
                            - PARTNERSHIP
                            - LLP
                            - LLC
                            - C_CORP
                            - S_CORP
                            - B_CORP
                            - NON_PROFIT
                        taxId:
                          type: string
                          pattern: '^\d{9}$'
                        taxIdType:
                          type: string
                          enum: 
                            - TIN
                            - EIN
                        incorporationDate:
                          type: string
                          pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
                        address:
                          $ref: '#/components/schemas/Address'
              responses:
                '200':
                  description: "Successful response"
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /get-user-profile:
            get:
              summary: "Fetches user profile, including onboarding status, user type, etc"
              operationId: "GetUserProfile"
              responses:
                '200':
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          hasOnboarded:
                            type: boolean
                          userType:
                            $ref: '#/components/schemas/UserType'
                          isApproved:
                            type: boolean
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /create-m2m-credentials:
            get:
              summary: "Creates m2m credentials for a merchant"
              operationId: "CreateM2mCredentials"
              responses:
                '200':
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          clientId:
                            type: string
                          clientSecret:
                            type: string
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /list-m2m-credentials:
            post:
              summary: "Lists m2m credentials. Only returns client id"
              operationId: "ListM2MCredentials"
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        continuationToken:
                          type: string
                          minLength: 1
                          maxLength: 256
              responses:
                '200':
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          credentials:
                            type: array
                            items:
                              type: object
                              properties:
                                clientId:
                                  type: string
                          continuationToken:
                            type: string
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /delete-m2m-credentials:
            post:
              summary: "Deletes m2m credentials."
              operationId: "DeleteM2MCredentials"
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                        - clientId
                      properties:
                        clientId:
                          type: string
                          minLength: 1
                          maxLength: 256
              responses:
                '200':
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                         clientId:
                           type: string
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

  CustomAuthorizerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      FunctionName: AuthorizerHandler
      Handler: main
      Runtime: provided.al2
      CodeUri: ../golang/authorizer/build/function.zip
      Timeout: 5
      SnapStart:
        ApplyOn: None
      Environment:
        Variables:
          AUTH_DOMAIN: !Ref Auth0Domain
          AUDIENCE: https://dashboard.zenobiapay.com
          VALID_ORUM_IP_ADDRESSES: !Ref OrumIpAddresses

  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/api-gateway/zenobia-access-logs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ApiGatewayPushToCloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                Resource: "*"

  BankHandlerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      FunctionName: BankHandler
      CodeUri: ../kotlin/lambda/bank-handler/build/libs/lambda.jar
      Handler: com.zenobiapay.bank.handlers.BankHandler::handleRequest
      MemorySize: 2048
      Environment:
        Variables:
          BANK_TABLE_NAME: !Ref BankTableName
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref PlaidSecretsArn
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref OrumSecretsArn
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref PaginationSigningSecret
        - AWSLambdaVPCAccessExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref BankTableName
        - KMSEncryptPolicy:
            KeyId: !Ref BankKeyId
        - KMSDecryptPolicy:
            KeyId: !Ref BankKeyId
      Events:
        GetCreateLinkToken:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /create-link-token
            Method: POST
        GetExchangeToken:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /exchange-token
            Method: POST
        ListBanks:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /list-bank-accounts
            Method: POST
        DeleteBankAccount:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /delet-bank-account
            Method: POST

  TransferHandlerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      FunctionName: TransferHandler
      CodeUri: ../kotlin/lambda/transfer-handler/build/libs/lambda.jar
      Handler: com.zenobiapay.transfer.handlers.TransferHandler::handleRequest
      MemorySize: 2048
      Environment:
        Variables:
          TRANSFER_TABLE_NAME: !Ref TransferTableName
          BANK_TABLE_NAME: !Ref BankTableName
          USER_TABLE_NAME: !Ref UserTableName
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref OrumSecretsArn
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref PaginationSigningSecret
        - AWSLambdaVPCAccessExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref TransferTableName
        - DynamoDBReadPolicy:
            TableName: !Ref BankTableName
        - DynamoDBReadPolicy:
            TableName: !Ref UserTableName
        - KMSEncryptPolicy:
            KeyId: !Ref TransferKeyId
        - KMSDecryptPolicy:
            KeyId: !Ref TransferKeyId
        - KMSDecryptPolicy:
            KeyId: !Ref BankKeyId
        - KMSDecryptPolicy:
            KeyId: !Ref UserKeyId
      Events:
        CreateTransferRequest:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /create-transfer-request
            Method: POST
        FulfillTransfer:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /fulfill-transfer
            Method: POST
        GetCustomerTransfer:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /get-customer-transfer
            Method: GET
        GetMerchantTransfer:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /get-merchant-transfer
            Method: GET
        ListCustomerTransfers:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /list-customer-transfers
            Method: POST
        ListMerchantTransfers:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /list-merchant-transfers
            Method: POST
        ListMerchantPayouts:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /list-merchant-payouts.json
            Method: POST

  UserHandlerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      FunctionName: UserHandler
      CodeUri: ../kotlin/lambda/user-handler/build/libs/lambda.jar
      Handler: com.zenobiapay.user.handlers.UserHandler::handleRequest
      MemorySize: 2048
      Environment:
        Variables:
          USER_TABLE_NAME: !Ref UserTableName
          BANK_TABLE_NAME: !Ref BankTableName
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref UserTableName
        - DynamoDBReadPolicy:
            TableName: !Ref BankTableName
        - KMSEncryptPolicy:
            KeyId: !Ref UserKeyId
        - KMSDecryptPolicy:
            KeyId: !Ref UserKeyId
        - KMSDecryptPolicy:
            KeyId: !Ref BankKeyId
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref OrumSecretsArn
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref Auth0SecretsArn
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref PlaidSecretsArn
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref PaginationSigningSecret
      Events:
        UpdateMerchant:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /update-merchant-config
            Method: POST
        GetMerchant:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /get-merchant-config
            Method: GET
        GetUserProfile:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /get-user-profile
            Method: GET
        SubmitCustomerOnboarding:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /submit-customer-onboarding
            Method: POST
        SubmitMerchantOnboarding:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /submit-merchant-onboarding
            Method: POST
        CreateM2MCredentials:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /create-m2m-credentials
            Method: GET
        ListM2MCredentials:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /list-m2m-credentials
            Method: POST
        DeleteM2MCredentials:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /delete-m2m-credentials
            Method: POST

  PaginationSigningSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: pagination/hmac
      Description: HMAC secret for signing pagination tokens
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: secret
        PasswordLength: 32
        ExcludeCharacters: "\"@/\\^`|&[](){}$"

  WebhookHandlerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      FunctionName: WebhookHandler
      CodeUri: ../kotlin/lambda/webhook-handler/build/libs/lambda.jar
      Handler: com.zenobiapay.webhook.handlers.WebhookHandler::handleRequest
      MemorySize: 2048
      Environment:
        Variables:
          ORUM_PUBLIC_CERTIFICATE: !Ref OrumPublicCertificate
          ORUM_SLACK_WEBHOOK: !Ref OrumSlackWebhook
      Policies:
        - AWSLambdaVPCAccessExecutionRole
      Events:
        OrumWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /orum-webhook
            Method: POST
            Auth:
              Authorizer: SignatureAuthorizer

  WebhookSigningKey:
    Type: AWS::KMS::Key
    Properties:
      Description: "KMS Key for signing JWT webhooks"
      KeyUsage: SIGN_VERIFY
      KeySpec: RSA_2048
      Enabled: true
      EnableKeyRotation: false
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowRootAccountAccess
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowLambdaUse
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - kms:GetPublicKey
              - kms:Sign
            Resource: "*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref AWS::AccountId
                kms:ViaService: !Sub lambda.${AWS::Region}.amazonaws.com
              ArnLike: # Hack to tighten up kms to only be used by the transfer event handler. Cannot reference directly as there is a circular dependency
                  aws:PrincipalArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/*-TransferTableEventHandler-*"

  WebhookSigningKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/webhook-signing-key
      TargetKeyId: !Ref WebhookSigningKey

  TransferTableEventHandler:
    Type: 'AWS::Serverless::Function'
    Metadata:
      SkipBuild: true
    Properties:
      FunctionName: TransferTableEventHandler
      Handler: com.zenobiapay.transfertableevent.handlers.TransferTableEventHandler::handleRequest
      Runtime: java17
      CodeUri: ../kotlin/lambda/transfer-event-handler/build/libs/lambda.jar
      Environment:
        Variables:
          WEBHOOK_KMS_ALIAS: !Ref WebhookSigningKeyAlias
      Policies:
        - DynamoDBStreamReadPolicy:
            TableName: !Ref TransferTableName
            StreamName: !Select [3, !Split ["/", !Ref TransferTableStreamArn]]
        - KMSDecryptPolicy:
            KeyId: !Ref TransferKeyId
        - Statement:
          - Sid: AllowKmsSignedWebhooks
            Effect: Allow
            Action:
            - kms:GetPublicKey
            - kms:Sign
            Resource: !GetAtt WebhookSigningKey.Arn
      Events:
        DynamoDBStreamEvent:
          Type: DynamoDB
          Properties:
            Stream: !Ref TransferTableStreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 5

Outputs:
  WebEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ZenobiaApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
