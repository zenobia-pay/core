  CustomAuthorizerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      FunctionName: AuthorizerHandler
      Handler: main
      Runtime: provided.al2
      CodeUri: ../golang/authorizer/build/function.zip
      Timeout: 5
      Tracing: Active
      SnapStart:
        ApplyOn: None
      Environment:
        Variables:
          AUTH_DOMAIN: !Ref Auth0Domain
          AUDIENCE: https://dashboard.zenobiapay.com
          ADMIN_AUDIENCE: https://admin.zenobiapay.com
          VALID_ORUM_IP_ADDRESSES: !Ref OrumIpAddresses
          VALID_PLAID_IP_ADDRESSES: !Ref PlaidIpAddresses
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref CustomerJwtSigningSecret
        - CloudWatchPutMetricPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: "*"

  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/api-gateway/zenobia-access-logs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ApiGatewayPushToCloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                Resource: "*"

  JwtIssuerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      FunctionName: JwtIssuer
      Handler: main
      Runtime: provided.al2
      CodeUri: ../golang/jwt-issuer/build/function.zip
      Timeout: 30
      SnapStart:
        ApplyOn: None
      Environment:
        Variables:
          CREDENTIALS_TABLE_NAME: !Ref CredentialsTableName
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref RefreshTokenHashingSecret
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref CustomerJwtSigningSecret
        - DynamoDBReadPolicy:
            TableName: !Ref CredentialsTableName
        - KMSDecryptPolicy:
            KeyId: !Ref CredentialsTableKeyId
        - CloudWatchPutMetricPolicy: {}
      Events:
        IssueJwt:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /issue-jwt
            Method: POST

  BankHandlerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      FunctionName: BankHandler
      CodeUri: ../kotlin/lambda/bank-handler/build/libs/lambda.jar
      Handler: com.zenobiapay.bank.handlers.BankHandler::handleRequest
      Tracing: Active
