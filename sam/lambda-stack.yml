AWSTemplateFormatVersion: "2010-09-09"
Transform: "AWS::Serverless-2016-10-31"
Description: Stack to store Lambda handlers

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: java17
    Architectures:
      - x86_64
    VpcConfig:
      SecurityGroupIds:
        - !Ref SecurityGroupId
      SubnetIds:
        - !Ref SubnetId1
        - !Ref SubnetId2

Parameters:
  BankKeyId:
    Type: String
  TransferKeyId:
    Type: String
  UserKeyId:
    Type: String
  BankTableName:
    Type: String
  TransferTableName:
    Type: String
  UserTableName:
    Type: String
  TransferTableStreamArn:
    Type: String
  SecurityGroupId:
    Type: String
  SubnetId1:
    Type: String
  SubnetId2:
    Type: String
  UserPoolArn:
    Type: String
  IdentityPoolId: 
    Type: String

Resources:
  ZenobiaApi:
    Type: AWS::Serverless::Api
    Properties:
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: Zenobia API
          version: 1.0
        components:
          responses:
            BadRequest:
              description: Bad request
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
            Forbidden:
              description: Forbidden
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
            NotFound:
              description: Resource not found
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
            InternalServerError:
              description: Internal server error
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
          schemas:
            ErrorResponse:
              type: object
              properties:
                error:
                  type: string
                message:
                  type: string
            PaymentParticipantIdentity:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
            TransferStatus:
              type: string
              enum:
                - NOT_STARTED
                - IN_FLIGHT
                - COMPLETED
                - FAILED
                - CANCELLED
            StatementItem:
              type: object
              properties:
                name:
                  type: string
                amount:
                  type: integer
            Location:
              type: object
              properties:
                address:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number

        paths:
          /get-auth-token:
            post:
              summary: "Gets auth token"
              operationId: "CreateAuthToken"
              security: []
              x-amazon-apigateway-auth:
                type: "NONE"
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        clientId:
                          type: string
                        clientSecret:
                          type: string
              responses:
                '200':
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          linkToken:
                            type: string
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${M2MAuthHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /create-link-token:
            get:
              summary: "Creates a plaid link token"
              operationId: "CreateLinkToken"
              responses:
                '200':
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          linkToken:
                            type: string
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BankHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /exchange-token:
            post:
              summary: "Exchanges plaid token"
              operationId: "ExchangeToken"
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        linkToken:
                          type: string

              responses:
                '200':
                  description: "Successful response"
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BankHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /list-bank-accounts:
            get:
              summary: "Lists all bank accounts associated with account"
              operationId: "ListBankAccounts"
              responses:
                '200':
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          continuationToken:
                            type: string
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                bankAccountId:
                                  type: string
                                bankAccountName:
                                  type: string
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BankHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /create-transfer-request:
            post:
              summary: "Creates a request for payment (merchant side)"
              operationId: "CreateTransferRequest"
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        amount:
                          type: integer
                        bankAccountId:
                          type: string
                        statementItems:
                          type: array
                          items:
                            $ref: "#/components/schemas/StatementItem"
              responses:
                '200':
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          transferRequestId:
                            type: string
                          merchantId:
                            type: string
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /fulfill-transfer:
            post:
              summary: "Fulfill transfer request (customer side)"
              operationId: "FulfillTransfer"
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        transferRequestId:
                          type: string
                        merchantId:
                          type: string
                        bankAccountId:
                          type: string
              responses:
                '200':
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          amount:
                            type: integer
                          merchant:
                            $ref: "#/components/schemas/PaymentParticipantIdentity"
                          statementItems:
                            type: array
                            items:
                              $ref: "#/components/schemas/StatementItem"
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"

              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /get-merchant-transfer:
            get:
              summary: "Fetches metadata associated with a merchant's transfer request"
              operationId: "GetMerchantTransfer"
              parameters:
                - name: id
                  in: query
                  required: true
                  schema:
                    type: string
              responses:
                '200':
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          transferRequestId:
                            type: string
                          merchant:
                            $ref: "#/components/schemas/PaymentParticipantIdentity"
                          status:
                            $ref: "#/components/schemas/TransferStatus"
                          statementItems:
                            type: array
                            items:
                              $ref: "#/components/schemas/StatementItem"
                          statusMessage:
                            type: string
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"

              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /list-customer-transfers:
            get:
              summary: "Lists all transfers made with customer account"
              operationId: "ListCustomerTransfers"
              responses:
                '200':
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          continuationToken:
                            type: string
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                amount:
                                  type: integer
                                creationTime:
                                  type: string
                                status:
                                  $ref: "#/components/schemas/TransferStatus"
                                merchant:
                                  $ref: "#/components/schemas/PaymentParticipantIdentity"
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"

              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /list-merchant-transfers:
            get:
              summary: "Lists all transfers made to a merchant account"
              operationId: "ListMerchantTransfers"
              parameters:
                - name: continuationToken
                  in: query
                  required: false
                  schema:
                    type: string
              responses:
                '200':
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          continuationToken:
                            type: string
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                amount:
                                  type: integer
                                status:
                                  type: string
                                transferRequestId:
                                  type: string
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"

              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /get-merchant-config:
            get:
              summary: "Fetches metadata associated with a merchant"
              operationId: "GetMerchantConfig"
              responses:
                '200':
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          bankAccountId:
                            type: string
                          merchantDisplayName:
                            type: string
                          merchantDescription:
                            type: string
                          webhookUrl:
                            type: string
                          merchantLocation:
                            $ref: "#/components/schemas/Location"
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /update-merchant-config:
            post:
              summary: "Update merchant configuration"
              operationId: "UpdateMerchantConfig"
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        bankAccountId:
                          type: string
                        merchantDisplayName:
                          type: string
                        merchantDescription:
                          type: string
                        webhookUrl:
                          type: string
                        merchantLocation:
                          $ref: "#/components/schemas/Location"
              responses:
                '200':
                  description: "Successful response"
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Ref UserPoolArn
      Cors:
        AllowCredentials: true
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'https://zenobiapay.com'"
      StageName: Prod
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","responseLatency":"$context.responseLatency","userAgent":"$context.identity.userAgent","requestTime":"$context.requestTime"}'
      MethodSettings:
        - LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true
          HttpMethod: "*"
          ResourcePath: "/*"

  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/api-gateway/zenobia-access-logs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ApiGatewayPushToCloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                Resource: "*"

  UnauthenticatedRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Federated: 'cognito-identity.amazonaws.com'
            Action: 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref IdentityPoolId

  AuthenticatedRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Federated: 'cognito-identity.amazonaws.com'
            Action: 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref IdentityPoolId
      Policies:
        - PolicyName: 'AuthenticatedPolicy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action: 'lambda:InvokeFunction'
                Resource: 
                  - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BankHandlerFunction}'
                  - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${TransferHandlerFunction}'


  CognitoIdentityPoolRoleAttachment:
    Type: 'AWS::Cognito::IdentityPoolRoleAttachment'
    Properties:
      IdentityPoolId: !Ref IdentityPoolId
      Roles:
        authenticated: !GetAtt AuthenticatedRole.Arn
        unauthenticated: !GetAtt UnauthenticatedRole.Arn

  M2MAuthHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: M2MAuthHandler
      CodeUri: ..
      Handler: com.zenobiapay.handlers.M2MAuthHandler::handleRequest
      MemorySize: 2048
      AutoPublishAlias: prod
      AutoPublishAliasAllProperties: true
      Events:
        GetAuthToken:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /get-auth-token
            Method: POST
            Auth:
              OverrideApiAuth: true
              Authorizer: "NONE"

  BankHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: BankHandler
      CodeUri: ..
      Handler: com.zenobiapay.handlers.BankHandler::handleRequest
      MemorySize: 2048
      AutoPublishAlias: prod
      AutoPublishAliasAllProperties: true
#      ProvisionedConcurrencyConfig:
#        ProvisionedConcurrentExecutions: 5
      Environment:
        Variables:
          BANK_TABLE_NAME: !Ref BankTableName
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: "arn:aws:secretsmanager:us-east-1:816069139448:secret:plaid/sandbox/credentials-cRPbpD" # TODO dont hardcode
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: "arn:aws:secretsmanager:us-east-1:816069139448:secret:orum/sandbox/credentials-VS6HFc" # TODO dont hardcode
        - AWSLambdaVPCAccessExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref BankTableName
        - KMSEncryptPolicy:
            KeyId: !Ref BankKeyId
        - KMSDecryptPolicy:
            KeyId: !Ref BankKeyId
      Events:
        GetCreateLinkToken:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /create-link-token
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        GetExchangeToken:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /exchange-token
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        ListBanks:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /list-bank-accounts
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  TransferHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TransferHandler
      CodeUri: ..
      Handler: com.zenobiapay.handlers.TransferHandler::handleRequest
      MemorySize: 2048
      AutoPublishAlias: prod
      AutoPublishAliasAllProperties: true
#      ProvisionedConcurrencyConfig:
#        ProvisionedConcurrentExecutions: 3
#      AutoPublishAlias: live
#      AutoPublishAliasAllProperties: true
      Environment:
        Variables:
          TRANSFER_TABLE_NAME: !Ref TransferTableName
          BANK_TABLE_NAME: !Ref BankTableName
          USER_TABLE_NAME: !Ref UserTableName
          COGNITO_USER_POOL_ARN: !Ref UserPoolArn
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: "arn:aws:secretsmanager:us-east-1:816069139448:secret:plaid/sandbox/credentials-cRPbpD" # TODO dont hardcode
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: "arn:aws:secretsmanager:us-east-1:816069139448:secret:orum/sandbox/credentials-VS6HFc" # TODO dont hardcode
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
          - Effect: Allow
            Action:
              - cognito-idp:AdminGetUser  # This grants access to get user details
            Resource: !Ref UserPoolArn
        - DynamoDBCrudPolicy:
            TableName: !Ref TransferTableName
        - DynamoDBReadPolicy:
            TableName: !Ref BankTableName
        - DynamoDBReadPolicy:
            TableName: !Ref UserTableName
        - KMSEncryptPolicy:
            KeyId: !Ref TransferKeyId
        - KMSDecryptPolicy:
            KeyId: !Ref TransferKeyId
        - KMSDecryptPolicy:
            KeyId: !Ref BankKeyId
        - KMSDecryptPolicy:
            KeyId: !Ref UserKeyId
      Events:
        CreateTransferRequest:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /create-transfer-request
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        FulfillTransfer:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /fulfill-transfer
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        GetCustomerTransfer:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /get-customer-transfer
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        GetMerchantTransfer:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /get-merchant-transfer
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        ListCustomerTransfers:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /list-customer-transfers
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        ListMerchantTransfers:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /list-merchant-transfers
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  UserHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: UserHandler
      CodeUri: ..
      Handler: com.zenobiapay.handlers.UserHandler::handleRequest
      MemorySize: 2048
#      ProvisionedConcurrencyConfig:
#        ProvisionedConcurrentExecutions: 5
      AutoPublishAlias: prod
      AutoPublishAliasAllProperties: true
      Environment:
        Variables:
          USER_TABLE_NAME: !Ref UserTableName
          BANK_TABLE_NAME: !Ref BankTableName
          COGNITO_USER_POOL_ARN: !Ref UserPoolArn
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref UserTableName
        - DynamoDBReadPolicy:
            TableName: !Ref BankTableName
        - Statement: # TODO: remove after switching away cognito util
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser  # This grants access to get user details
              Resource: !Ref UserPoolArn
        - KMSEncryptPolicy:
            KeyId: !Ref UserKeyId
        - KMSDecryptPolicy:
            KeyId: !Ref UserKeyId
        - KMSDecryptPolicy:
            KeyId: !Ref BankKeyId
      Events:
        UpdateMerchant:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /update-merchant-config
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        GetMerchant:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /get-merchant-config
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  CognitoEventHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CognitoEventHandler
      CodeUri: ..
      Handler: com.zenobiapay.handlers.CognitoEventHandler::handleRequest
      Environment:
        Variables:
          USER_TABLE_NAME: !Ref UserTableName
          COGNITO_USER_POOL_ARN: !Ref UserPoolArn
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref UserTableName
        - KMSEncryptPolicy:
            KeyId: !Ref UserKeyId
        - KMSDecryptPolicy:
            KeyId: !Ref UserKeyId
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: "arn:aws:secretsmanager:us-east-1:816069139448:secret:orum/sandbox/credentials-VS6HFc" # TODO dont hardcode
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminAddUserToGroup
              Resource: !Ref UserPoolArn

  CognitoEventHandlerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CognitoEventHandlerFunction
      Action: lambda:InvokeFunction
      Principal: "cognito-idp.amazonaws.com"
      SourceAccount: !Sub "${AWS::AccountId}"
      SourceArn: !Ref UserPoolArn

  TransferTableEventHandler:
    Type: 'AWS::Serverless::Function'
    Properties:
      FunctionName: TransferTableEventHandler
      Handler: com.zenobiapay.handlers.TransferTableEventHandler::handleRequest
      Runtime: java17
      CodeUri: ..
      Policies:
        - DynamoDBStreamReadPolicy:
            TableName: !Ref TransferTableName
            StreamName: !Select [3, !Split ["/", !Ref TransferTableStreamArn]]
        - KMSDecryptPolicy:
            KeyId: !Ref TransferKeyId
      Events:
        DynamoDBStreamEvent:
          Type: DynamoDB
          Properties:
            Stream: !Ref TransferTableStreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 5

Outputs:
  WebEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ZenobiaApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
