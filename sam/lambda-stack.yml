  ItemHandlerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      FunctionName: ItemHandler
      CodeUri: ../kotlin/lambda/item-handler/build/libs/lambda.jar
      Handler: com.zenobiapay.item.handlers.ItemHandler::handleRequest
      Tracing: Active
      MemorySize: 1024
      ProvisionedConcurrencyConfig: 
        Fn::If:
          - IsProd
          - ProvisionedConcurrentExecutions: 1
          - !Ref AWS::NoValue
      Environment:
        Variables:
          METADATA_DB_PROXY_ENDPOINT: !Ref MetadataDBProxyEndpoint
          METADATA_DB_NAME: !Ref MetadataDBName
          METADATA_DB_SECRET_ARN: !Ref MetadataDBSecret
          IMAGE_STORAGE_BUCKET_NAME: !Ref ImageStorageBucketName
          RESALE_SERVICE_ENDPOINT: !Ref ResaleServiceEndpoint
          RESALE_SIGNING_SECRET: !Ref ResaleSigningSecret
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - CloudWatchPutMetricPolicy: {}
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref MetadataDBSecret
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref ResaleSigningSecret
        - Statement:
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: !Ref MetadataDBKmsKeyArn
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
                - s3:PutObject
              Resource: 
                - !Sub "arn:aws:s3:::${ImageStorageBucketName}"
                - !Sub "arn:aws:s3:::${ImageStorageBucketName}/*"
        - Statement:
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:GenerateDataKey
              Resource: !Ref ImageStorageBucketKmsKeyArn
        - Statement:
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: "*"
      Events:
