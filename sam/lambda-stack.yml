AWSTemplateFormatVersion: "2010-09-09"
Transform: "AWS::Serverless-2016-10-31"
Description: Stack to store Lambda handlers

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: java17
    Architectures:
      - x86_64
    AutoPublishAlias: prod
    SnapStart:
      ApplyOn: PublishedVersions
    AutoPublishAliasAllProperties: true
    VpcConfig:
      SecurityGroupIds:
        - !Ref SecurityGroupId
      SubnetIds:
        - !Ref SubnetId1
        - !Ref SubnetId2

Parameters:
  BankKeyId:
    Type: String
  TransferKeyId:
    Type: String
  UserKeyId:
    Type: String
  CredentialsKeyId:
    Type: String
  BankTableName:
    Type: String
  TransferTableName:
    Type: String
  UserTableName:
    Type: String
  CredentialsTableName:
    Type: String
  TransferTableStreamArn:
    Type: String
  SecurityGroupId:
    Type: String
  SubnetId1:
    Type: String
  SubnetId2:
    Type: String
  UserPoolArn:
    Type: String
  IdentityPoolId: 
    Type: String

Resources:
  ZenobiaApi:
    Type: AWS::Serverless::Api
    Properties:
      Auth:
        DefaultAuthorizer: CustomAuthorizer
        Authorizers:
          CustomAuthorizer:
            FunctionPayloadType: REQUEST
            FunctionArn: !GetAtt CustomAuthorizerFunction.Arn
            Identity:
              Headers: 
                - Authorization
      Cors:
        AllowCredentials: true
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'https://zenobiapay.com'"
      StageName: Prod
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","responseLatency":"$context.responseLatency","userAgent":"$context.identity.userAgent","requestTime":"$context.requestTime"}'
      MethodSettings:
        - LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true
          HttpMethod: "*"
          ResourcePath: "/*"
  
  CustomAuthorizerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      FunctionName: AuthorizerHandler
      Handler: main
      Runtime: provided.al2
      CodeUri: ../golang/authorizer/build/function.zip
      Timeout: 5
      SnapStart:
        ApplyOn: None
      Environment:
        Variables:
          AUTH_DOMAIN: dev-u0ert1rxhkdmhwy8.us.auth0.com
          AUDIENCE: https://zenobiapay.com
          AUTH0_CLIENT_ID: MBxUwuO3ApyissWpYzT74gBGW0FbC9nn

  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/api-gateway/zenobia-access-logs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ApiGatewayPushToCloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                Resource: "*"

  UnauthenticatedRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Federated: 'cognito-identity.amazonaws.com'
            Action: 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref IdentityPoolId

  AuthenticatedRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Federated: 'cognito-identity.amazonaws.com'
            Action: 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref IdentityPoolId
      Policies:
        - PolicyName: 'AuthenticatedPolicy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action: 'lambda:InvokeFunction'
                Resource: 
                  - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BankHandlerFunction}'
                  - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${TransferHandlerFunction}'


  CognitoIdentityPoolRoleAttachment:
    Type: 'AWS::Cognito::IdentityPoolRoleAttachment'
    Properties:
      IdentityPoolId: !Ref IdentityPoolId
      Roles:
        authenticated: !GetAtt AuthenticatedRole.Arn
        unauthenticated: !GetAtt UnauthenticatedRole.Arn

  BankHandlerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      FunctionName: BankHandler
      CodeUri: ../kotlin/lambda/bank-handler/build/libs/lambda.jar
      Handler: com.zenobiapay.bank.handlers.BankHandler::handleRequest
      MemorySize: 2048
      Environment:
        Variables:
          BANK_TABLE_NAME: !Ref BankTableName
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: "arn:aws:secretsmanager:us-east-1:816069139448:secret:plaid/sandbox/credentials-cRPbpD" # TODO dont hardcode
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: "arn:aws:secretsmanager:us-east-1:816069139448:secret:orum/sandbox/credentials-VS6HFc" # TODO dont hardcode
        - AWSLambdaVPCAccessExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref BankTableName
        - KMSEncryptPolicy:
            KeyId: !Ref BankKeyId
        - KMSDecryptPolicy:
            KeyId: !Ref BankKeyId
      Events:
        GetCreateLinkToken:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /create-link-token
            Method: GET
        GetExchangeToken:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /exchange-token
            Method: POST
        ListBanks:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /list-bank-accounts
            Method: GET

  TransferHandlerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      FunctionName: TransferHandler
      CodeUri: ../kotlin/lambda/transfer-handler/build/libs/lambda.jar
      Handler: com.zenobiapay.transfer.handlers.TransferHandler::handleRequest
      MemorySize: 2048
      Environment:
        Variables:
          TRANSFER_TABLE_NAME: !Ref TransferTableName
          BANK_TABLE_NAME: !Ref BankTableName
          USER_TABLE_NAME: !Ref UserTableName
          COGNITO_USER_POOL_ARN: !Ref UserPoolArn
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: "arn:aws:secretsmanager:us-east-1:816069139448:secret:plaid/sandbox/credentials-cRPbpD" # TODO dont hardcode
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: "arn:aws:secretsmanager:us-east-1:816069139448:secret:orum/sandbox/credentials-VS6HFc" # TODO dont hardcode
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
          - Effect: Allow
            Action:
              - cognito-idp:AdminGetUser  # This grants access to get user details
            Resource: !Ref UserPoolArn
        - DynamoDBCrudPolicy:
            TableName: !Ref TransferTableName
        - DynamoDBReadPolicy:
            TableName: !Ref BankTableName
        - DynamoDBReadPolicy:
            TableName: !Ref UserTableName
        - KMSEncryptPolicy:
            KeyId: !Ref TransferKeyId
        - KMSDecryptPolicy:
            KeyId: !Ref TransferKeyId
        - KMSDecryptPolicy:
            KeyId: !Ref BankKeyId
        - KMSDecryptPolicy:
            KeyId: !Ref UserKeyId
      Events:
        CreateTransferRequest:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /create-transfer-request
            Method: POST
        FulfillTransfer:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /fulfill-transfer
            Method: POST
        GetCustomerTransfer:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /get-customer-transfer
            Method: GET
        GetMerchantTransfer:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /get-merchant-transfer
            Method: GET
        ListCustomerTransfers:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /list-customer-transfers
            Method: GET
        ListMerchantTransfers:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /list-merchant-transfers
            Method: GET

  UserHandlerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      FunctionName: UserHandler
      CodeUri: ../kotlin/lambda/user-handler/build/libs/lambda.jar
      Handler: com.zenobiapay.user.handlers.UserHandler::handleRequest
      MemorySize: 2048
      Environment:
        Variables:
          USER_TABLE_NAME: !Ref UserTableName
          BANK_TABLE_NAME: !Ref BankTableName
          COGNITO_USER_POOL_ARN: !Ref UserPoolArn
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref UserTableName
        - DynamoDBReadPolicy:
            TableName: !Ref BankTableName
        - Statement: # TODO: remove after switching away cognito util
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser  # This grants access to get user details
              Resource: !Ref UserPoolArn
        - KMSEncryptPolicy:
            KeyId: !Ref UserKeyId
        - KMSDecryptPolicy:
            KeyId: !Ref UserKeyId
        - KMSDecryptPolicy:
            KeyId: !Ref BankKeyId
      Events:
        UpdateMerchant:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /update-merchant-config
            Method: POST
        GetMerchant:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /get-merchant-config
            Method: GET

  UserSignUpHandlerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      FunctionName: CustomerSignUpHandler
      CodeUri: ../kotlin/lambda/cognito-handler/build/libs/lambda.jar
      Handler: com.zenobiapay.cognito.handlers.CustomerSignupEventHandler::handleRequest
      SnapStart:
        ApplyOn: None
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref UserTableName
        - KMSEncryptPolicy:
            KeyId: !Ref UserKeyId
        - KMSDecryptPolicy:
            KeyId: !Ref UserKeyId
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: "arn:aws:secretsmanager:us-east-1:816069139448:secret:orum/sandbox/credentials-VS6HFc" # TODO dont hardcode
      Events:
        RegisterUser:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /register-user
            Method: POST

  TransferTableEventHandler:
    Type: 'AWS::Serverless::Function'
    Metadata:
      SkipBuild: true
    Properties:
      FunctionName: TransferTableEventHandler
      Handler: com.zenobiapay.transfertableevent.handlers.TransferTableEventHandler::handleRequest
      Runtime: java17
      CodeUri: ../kotlin/lambda/transfer-event-handler/build/libs/lambda.jar
      Policies:
        - DynamoDBStreamReadPolicy:
            TableName: !Ref TransferTableName
            StreamName: !Select [3, !Split ["/", !Ref TransferTableStreamArn]]
        - KMSDecryptPolicy:
            KeyId: !Ref TransferKeyId
      Events:
        DynamoDBStreamEvent:
          Type: DynamoDB
          Properties:
            Stream: !Ref TransferTableStreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 5

Outputs:
  WebEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ZenobiaApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
