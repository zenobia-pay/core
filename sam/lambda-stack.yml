            Path: /complete-sell-job
            Method: POST
        SellItem:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /sell-item
            Method: POST

  PaginationSigningSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: pagination/hmac
      Description: HMAC secret for signing pagination tokens
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: secret
        PasswordLength: 32
        ExcludeCharacters: "\"@/\\^`|&[](){}$"

  WebsocketTransferSubscribeSigningSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: websocket/subscribe/hmac
      Description: HMAC secret for merchant component to listen for updates
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: secret
        PasswordLength: 32
        ExcludeCharacters: "\"@/\\^`|&[](){}$"

  WebhookHandlerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      FunctionName: WebhookHandler
      CodeUri: ../kotlin/lambda/webhook-handler/build/libs/lambda.jar
      Handler: com.zenobiapay.webhook.handlers.WebhookHandler::handleRequest
      Tracing: Active
      MemorySize: 2048
      Environment:
        Variables:
          ORUM_PUBLIC_CERTIFICATE: !Ref OrumPublicCertificate
          WEBHOOK_QUEUE_URL: !Ref WebhookEventQueue
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - CloudWatchPutMetricPolicy: {}
        - SQSSendMessagePolicy:
            QueueName: !GetAtt WebhookEventQueue.QueueName
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref PlaidSecretsArn
        - Statement:
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: "*"
      Events:
        OrumWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /orum-webhook
            Method: POST
            Auth:
              Authorizer: SignatureAuthorizer
        PlaidWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref ZenobiaApi
            Path: /plaid-webhook
            Method: POST
            Auth:
              Authorizer: PlaidSignatureAuthorizer

  WebhookEventQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: WebhookEventQueue
      MessageRetentionPeriod: 1209600  # Max: 14 days (in seconds)
      VisibilityTimeout: 70
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WebhookEventQueueDLQ.Arn
        maxReceiveCount: 5

  WebhookEventQueueDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: WebhookEventQueueDLQ
      MessageRetentionPeriod: 1209600  # Max: 14 days (in seconds)

  WebhookEventFunctionDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: WebhookEventFunctionDLQ
      MessageRetentionPeriod: 1209600  # Max: 14 days (in seconds)

  WebhookEventHandlerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      FunctionName: WebhookEventHandler
      CodeUri: ../kotlin/lambda/webhook-event-handler/build/libs/lambda.jar
      Handler: com.zenobia.webhook.event.handlers.WebhookEventHandler::handleRequest
      Tracing: Active
      Environment:
        Variables:
          ORUM_SLACK_WEBHOOK: !Ref OrumSlackWebhook
          PLAID_SLACK_WEBHOOK: !Ref PlaidSlackWebhook
          TRANSFER_TABLE_NAME: !Ref TransferTableName
      Policies:
        - CloudWatchPutMetricPolicy: {}
        - DynamoDBCrudPolicy:
            TableName: !Ref TransferTableName
        - KMSDecryptPolicy:
            KeyId: !Ref TransferKeyId
        - KMSEncryptPolicy:
            KeyId: !Ref TransferKeyId
        - SQSSendMessagePolicy:
            QueueName: !GetAtt WebhookEventFunctionDLQ.QueueName
        - SQSPollerPolicy:
            QueueName: !GetAtt WebhookEventQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: "*"
      Events:
        EventFromWebhookEventQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt WebhookEventQueue.Arn
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt WebhookEventFunctionDLQ.Arn

Outputs:
  WebEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ZenobiaApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
