AWSTemplateFormatVersion: "2010-09-09"
Transform: "AWS::Serverless-2016-10-31"
Description: Stack to store Lambda handlers

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: java17
    Architectures:
      - x86_64
    AutoPublishAlias: prod
    AutoPublishAliasAllProperties: true
    VpcConfig:
      SecurityGroupIds:
        - !Ref SecurityGroupId
      SubnetIds:
        - !Ref SubnetId1
        - !Ref SubnetId2

Parameters:
  Stage: 
    Type: String
  CredentialsTableKeyId:
    Type: String
  BankKeyId:
    Type: String
  TransferKeyId:
    Type: String
  UserKeyId:
    Type: String
  CredentialsTableName:
    Type: String
  BankTableName:
    Type: String
  TransferTableName:
    Type: String
  UserTableName:
    Type: String
  TransferTableStreamArn:
    Type: String
  SecurityGroupId:
    Type: String
  SubnetId1:
    Type: String
  SubnetId2:
    Type: String
  PlaidSecretsArn:
    Type: String
  OrumSecretsArn:
    Type: String
  Auth0SecretsArn:
    Type: String
  Auth0Domain:
    Type: String
    Description: Auth0 domain used for authentication
  OrumPublicCertificate:
    Type: String
    Description: Orum public certificate used for webhook signing
  OrumIpAddresses:
    Type: String
    Description: Valid orum ip addresses to accept requests from. Comma separated.
  OrumSlackWebhook:
    Type: String
    Description: Slack webhook for orum channel
  PlaidIpAddresses:
    Type: String
    Description: Valid plaid ip addresses to accept requests from. Comma separated.
  PlaidSlackWebhook:
    Type: String
    Description: Slack webhook for plaid channel
  CustomerJwtSigningSecret:
    Type: String
    Description: Signing secret for jwt
  RefreshTokenHashingSecret:
    Type: String
    Description: Hash secret for refresh tokens
  BankAccountHashingSecret:
    Type: String
    Description: Hash secret for bank accounts
  ZenobiaApiEndpoint:
    Type: String
    Description: Zenobia endpoint used to point plaid webhooks
  MetadataDBEndpoint:
    Type: String
    Description: Endpoint of the Metadata RDS instance
  MetadataDBPort:
    Type: String
    Description: Port of the Metadata RDS instance
  MetadataDBName:
    Type: String
    Description: Database name of the Metadata RDS instance
  MetadataDBSecret:
    Type: String
    Description: ARN of the secret containing RDS credentials
  MetadataDBProxyEndpoint:
    Type: String
    Description: Endpoint of the RDS Proxy for the Metadata database
  MetadataDBKmsKeyArn:
    Type: String
    Description: ARN of the KMS key used to encrypt the Metadata RDS instance
  ItemMetadataQueueUrl:
    Type: String
    Description: URL of the Transfer Metadata Queue
  ImageStorageBucketName:
    Type: String
    Description: Name of the S3 bucket for storing images
  ImageStorageBucketKmsKeyArn:
    Type: String
    Description: ARN of the KMS key used to encrypt the image storage S3 bucket
  ResaleServiceEndpoint:
    Type: String
    Description: Endpoint of the resale service used to automate selling on resale marketplaces.
  ResaleSigningSecret:
    Type: String
    Description: Signing secret used to authenticate requests to the resale service.

Conditions:
  IsProd: !Equals [!Ref Stage, "prod"]

Resources:
  ZenobiaApi:
    Type: AWS::Serverless::Api
    Properties:
      Auth:
        DefaultAuthorizer: ApiAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          ApiAuthorizer:
            FunctionPayloadType: REQUEST
            FunctionArn: !GetAtt CustomAuthorizerFunction.Arn
            Identity:
              Headers:
                - Authorization
          SignatureAuthorizer:
            FunctionPayloadType: REQUEST
            FunctionArn: !GetAtt CustomAuthorizerFunction.Arn
            Identity:
              Headers:
                - Signature
          PlaidSignatureAuthorizer:
            FunctionPayloadType: REQUEST
            FunctionArn: !GetAtt CustomAuthorizerFunction.Arn
            Identity:
              Headers:
                - plaid-verification
      Cors:
        AllowCredentials: true
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'https://dashboard.zenobiapay.com'"
      StageName: Prod
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: '{"requestId":"$context.requestId","sub":"$context.authorizer.sub","resourcePath": "$context.resourcePath","path":"$context.path","ip":"$context.identity.sourceIp","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","responseLatency":"$context.responseLatency","userAgent":"$context.identity.userAgent","requestTime":"$context.requestTime"}'
      MethodSettings:
        - LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true
          HttpMethod: "*"
          ResourcePath: "/*"
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: Zenobia API
          version: 1.0
        components:
          securitySchemes:
            SignatureAuthorizer:
              type: apiKey
              name: Signature
              in: header
              x-amazon-apigateway-authtype: custom
              x-amazon-apigateway-authorizer:
                type: request
                authorizerUri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomAuthorizerFunction.Arn}/invocations
                identitySource: method.request.header.Signature
            PlaidSignatureAuthorizer:
              type: apiKey
              name: PlaidSignature
              in: header
              x-amazon-apigateway-authtype: custom
              x-amazon-apigateway-authorizer:
                type: request
                authorizerUri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomAuthorizerFunction.Arn}/invocations
                identitySource: method.request.header.plaid-verification
          responses:
            BadRequest:
              description: Bad request
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
            Forbidden:
              description: Forbidden
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
            NotFound:
              description: Resource not found
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
            InternalServerError:
              description: Internal server error
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
          schemas:
            Item:
              type: object
              properties:
                itemId:
                  type: string
                name:
                  type: string
                brandName:
                  type: string
                size:
                  type: string
                color:
                  type: string
                material:
                  type: string
                year:
                  type: string
                imageUrls:
                  type: array
                  items:
                    type: string
            ErrorResponse:
              type: object
              properties:
                error:
                  type: string
                message:
                  type: string
            PaymentParticipantIdentity:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
            TransferStatus:
              type: string
              enum:
                - NOT_STARTED
                - PAID
                - SETTLED
                - FAILED
                - CANCELLED
                - REFUNDED
            StatementItem:
              type: object
              properties:
                itemId:
                  type: string
                metadata:
                  type: object
                  additionalProperties: true
                name:
                  type: string
                  maxLength: 255
                  minLength: 1
                amount:
                  type: integer
            Location:
              type: object
              properties:
                address:
                  type: string
                  maxLength: 255
                  minLength: 1
                latitude:
                  type: number
                longitude:
                  type: number
            UserType:
              type: string
              enum: [MERCHANT, CUSTOMER]
            CertificateType:
              type: string
              enum: [EC]
            SignatureType:
              type: string
              enum: [SHA256_WITH_ECDSA]
            BankAccount:
              type: object
              required:
                - name
              properties:
                bankAccountName:
                  type: string
                lastFourDigits:
                  type: string
                bankAccountId:
                  type: string

        x-amazon-apigateway-request-validators:
          basic:
            validateRequestParameters: true
            validateRequestBody: true
        x-amazon-apigateway-request-validator: basic
        paths:
          /orum-webhook:
            post:
              summary: "Orum webhook endpoint"
              security:
                - SignatureAuthorizer: []
              operationId: "OrumWebhook"
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                        - created_at
                        - event_id
                        - event_type
                        - event_data
                      properties:
                        created_at:
                          type: string
                        event_id:
                          type: string
                        event_type:
                          type: string
                        event_data:
                          type: object
              responses:
                "200":
                  description: "Successful response"
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebhookHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /plaid-webhook:
            post:
              summary: "Plaid webhook endpoint"
              security:
                - PlaidSignatureAuthorizer: []
              operationId: "PlaidWebhook"
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                        - webhook_type
                        - webhook_code
                        - item_id
                        - environment
                      properties:
                        webhook_type:
                          type: string
                        webhook_code:
                          type: string
                        item_id:
                          type: string
                        environment:
                          type: string
                        error:
                          type: object
                          properties:
                            error_code:
                              type: string
                            error_message:
                              type: string
                            error_type:
                              type: string
                            status:
                              type: integer
              responses:
                "200":
                  description: "Successful response"
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebhookHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /issue-jwt:
            post:
              summary: "Exchange refresh token for jwt"
              operationId: "IssueJwt"
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                        - refreshToken
                        - sub
                      properties:
                        refreshToken:
                          type: string
                        sub:
                          type: string
              responses:
                "200":
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          jwt:
                            type: string
                          expiresIn:
                            type: integer
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${JwtIssuerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /create-link-token:
            post:
              summary: "Creates a plaid link token"
              operationId: "CreateLinkToken"
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                        - product
                      properties:
                        product:
                          type: string
                          enum:
                            - AUTH
              responses:
                "200":
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          linkToken:
                            type: string
                          sub:
                            type: string
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BankHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /exchange-token:
            post:
              summary: "Exchanges plaid token"
              operationId: "ExchangeToken"
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        sub:
                          type: string
                          maxLength: 255
                        linkToken:
                          type: string
                          maxLength: 255
                        deviceId:
                          type: string
                          maxLength: 255
                        deviceCertificate:
                          type: object
                          properties:
                            certificateType:
                              $ref: "#/components/schemas/CertificateType"
                            certificateValue:
                              type: string
                              maxLength: 3000
                          required:
                            - certificateType
                            - certificateValue
                      required:
                        - linkToken
              responses:
                "200":
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          refreshToken:
                            type: string
                          sub:
                            type: string
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-request-validator: body

              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BankHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /list-bank-accounts:
            post:
              summary: "Lists all bank accounts associated with account"
              operationId: "ListBankAccounts"
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        deviceId:
                          type: string
                          maxLength: 255
                          minLength: 1
                        continuationToken:
                          type: string
                          maxLength: 512
              responses:
                "200":
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          continuationToken:
                            type: string
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/BankAccount"
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BankHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /delete-bank-account:
            post:
              summary: "Deletes a bank account."
              operationId: "DeleteBankAccount"
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                        - bankAccountId
                      properties:
                        deviceId:
                          type: string
                          maxLength: 255
                        bankAccountId:
                          type: string
                          maxLength: 255
                          minLength: 1
              responses:
                "200":
                  description: "Successful response"
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BankHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /delete-refresh-token:
            post:
              summary: "Deletes refresh token"
              operationId: "DeleteRefreshToken"
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                        - refreshToken
                      properties:
                        refreshToken:
                          type: string
                          maxLength: 255
              responses:
                "200":
                  description: "Successful response"
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BankHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /create-transfer-request:
            post:
              summary: "Creates a request for payment (merchant side)"
              operationId: "CreateTransferRequest"
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                        - amount
                      properties:
                        amount:
                          type: integer
                          minimum: 0
                          exclusiveMinimum: true
                        statementItems:
                          type: array
                          items:
                            $ref: "#/components/schemas/StatementItem"
                        expirySeconds:
                          type: integer
                          minimum: 0
                          exclusiveMinimum: true
                        transferMetadata:
                          type: object
                          additionalProperties: true
              responses:
                "200":
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          transferRequestId:
                            type: string
                          merchantId:
                            type: string
                          expiry:
                            type: integer
                          signature:
                            type: string
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /fulfill-transfer:
            post:
              summary: "Fulfill transfer request (customer side)"
              operationId: "FulfillTransfer"
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                        - transferRequestId
                        - bankAccountId
                        - deviceId
                        - signature
                      properties:
                        transferRequestId:
                          type: string
                          maxLength: 255
                        bankAccountId:
                          type: string
                          maxLength: 255
                        deviceId:
                          type: string
                          maxLength: 255
                        signature:
                          type: object
                          properties:
                            signatureType:
                              $ref: "#/components/schemas/SignatureType"
                            signatureValue:
                              maxLength: 1000
                              type: string
                          required:
                            - signatureType
                            - signatureValue
              responses:
                "200":
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          amount:
                            type: integer
                          merchant:
                            $ref: "#/components/schemas/PaymentParticipantIdentity"
                          statementItems:
                            type: array
                            items:
                              $ref: "#/components/schemas/StatementItem"
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"

              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /get-customer-transfer:
            get:
              summary: "Fetches metadata associated with a merchant's transfer request"
              operationId: "GetCustomerTransfer"
              parameters:
                - name: id
                  in: query
                  required: true
                  schema:
                    type: string
                    minLength: 1
                    maxLength: 256
              responses:
                "200":
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          amount:
                            type: integer
                          transferRequestId:
                            type: string
                          merchant:
                            $ref: "#/components/schemas/PaymentParticipantIdentity"
                          status:
                            $ref: "#/components/schemas/TransferStatus"
                          statementItems:
                            type: array
                            items:
                              $ref: "#/components/schemas/StatementItem"
                          statusMessage:
                            type: string
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /get-admin-transfer:
            post:
              summary: "Admin endpoint to fetch metadata associated with any merchant's transfer request"
              operationId: "GetAdminTransfer"
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                        - id
                        - sub
                      properties:
                        sub:
                          type: string
                          description: "The Auth0 sub of the merchant who owns the transfer"
              responses:
                "200":
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          transferRequestId:
                            type: string
                          amount:
                            type: integer
                          status:
                            $ref: "#/components/schemas/TransferStatus"
                          statementItems:
                            type: array
                            items:
                              $ref: "#/components/schemas/StatementItem"
                          statusMessage:
                            type: string
                          customerName:
                            type: string
                          fee:
                            type: integer
                          payoutTime:
                            type: string
                          creationTime:
                            type: string
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /get-merchant-transfer:
            get:
              summary: "Fetches metadata associated with a merchant's transfer request"
              operationId: "GetMerchantTransfer"
              parameters:
                - name: id
                  in: query
                  required: true
                  schema:
                    type: string
                    minLength: 1
                    maxLength: 256
              responses:
                "200":
                  description: "Successful response"
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          transferRequestId:
                            type: string
                          amount:
                            type: integer
                          status:
                            $ref: "#/components/schemas/TransferStatus"
                          statementItems:
                            type: array
                            items:
                              $ref: "#/components/schemas/StatementItem"
                          statusMessage:
                            type: string
                          customerName:
                            type: string
                          fee:
                            type: integer
                          payoutTime:
                            type: string
                          creationTime:
                            type: string
                "400":
                  $ref: "#/components/responses/BadRequest"
                "403":
                  $ref: "#/components/responses/Forbidden"
                "404":
                  $ref: "#/components/responses/NotFound"
                "500":
                  $ref: "#/components/responses/InternalServerError"
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
                httpMethod: POST
                type: aws_proxy

          /list-customer-transfers:
            post:
              summary: "Lists all transfers made with customer account"
              operationId: "ListCustomerTransfers"
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        continuationToken:
                          type: string
                          minLength: 1
                          maxLength: 512
              responses:
                "200":
                  description: "Successful response"
                  content:
