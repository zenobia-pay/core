AWSTemplateFormatVersion: "2010-09-09"
Transform: "AWS::Serverless-2016-10-31"
Description: Stack for handling transfer metadata with RDS

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: java17
    Architectures:
      - x86_64
    AutoPublishAlias: prod
    AutoPublishAliasAllProperties: true
    VpcConfig:
      SecurityGroupIds:
        - !Ref SecurityGroupId
      SubnetIds:
        - !Ref SubnetId1
        - !Ref SubnetId2

Parameters:
  Stage: 
    Type: String
    Description: Stage this code is being deployed to (dev, beta, gamma, prod)
  SecurityGroupId:
    Type: String
    Description: ID of the security group for the Lambda function
  SubnetId1:
    Type: String
    Description: ID of the first subnet for the Lambda function
  SubnetId2:
    Type: String
    Description: ID of the second subnet for the Lambda function
  MetadataDBProxyEndpoint:
    Type: String
    Description: Endpoint of the RDS Proxy for the Metadata database
  MetadataDBName:
    Type: String
    Description: Database name of the Metadata RDS instance
  MetadataDBSecret:
    Type: String
    Description: ARN of the secret containing RDS credentials
  TransferTableName:
    Type: String
    Description: Name of the transfer table

Conditions:
  IsProd: !Equals [!Ref Stage, "prod"]

Resources:
  # SQS Queue for transfer metadata
  TransferMetadataQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "TransferMetadataQueue-${Stage}"
      MessageRetentionPeriod: 1209600  # 14 days in seconds
      VisibilityTimeout: 120  # 2 minutes in seconds
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TransferMetadataQueueDLQ.Arn
        maxReceiveCount: 5

  # Dead Letter Queue for failed messages
  TransferMetadataQueueDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "TransferMetadataQueueDLQ-${Stage}"
      MessageRetentionPeriod: 1209600  # 14 days in seconds

  # Lambda function DLQ for function failures
  TransferMetadataRecorderDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "TransferMetadataRecorderDLQ-${Stage}"
      MessageRetentionPeriod: 1209600  # 14 days in seconds

  # Lambda function to process transfer metadata and store in RDS
  TransferMetadataHandlerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      FunctionName: !Sub "TransferMetadataHandler-${Stage}"
      CodeUri: ../kotlin/lambda/transfer-metadata-handler/build/libs/lambda.jar
      Handler: com.zenobiapay.transfermetadata.handlers.TransferMetadataHandler::handleRequest
      MemorySize: 1024
      Environment:
        Variables:
          METADATA_DB_PROXY_ENDPOINT: !Ref MetadataDBProxyEndpoint
          METADATA_DB_NAME: !Ref MetadataDBName
          METADATA_DB_SECRET_ARN: !Ref MetadataDBSecret
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - CloudWatchPutMetricPolicy: {}
        - SQSPollerPolicy:
            QueueName: !GetAtt TransferMetadataQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt TransferMetadataRecorderDLQ.QueueName
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref MetadataDBSecret
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt TransferMetadataQueue.Arn
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 30
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt TransferMetadataRecorderDLQ.Arn

Outputs:
  TransferMetadataQueueUrl:
    Description: "URL of the Transfer Metadata Queue"
    Value: !Ref TransferMetadataQueue
  
  TransferMetadataQueueArn:
    Description: "ARN of the Transfer Metadata Queue"
    Value: !GetAtt TransferMetadataQueue.Arn

  TransferMetadataHandlerFunctionArn:
    Description: "ARN of the Transfer Metadata Handler Lambda function"
    Value: !GetAtt TransferMetadataHandlerFunction.Arn