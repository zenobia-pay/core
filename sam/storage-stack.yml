AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Stack to store DDB tables and RDS instances

Parameters:
  Stage:
    Type: String
    Description: Stage this code is being deployed to (dev, beta, gamma, prod)
  UniqueIdentifier:
    Type: String
    Description: Unique identifier to avoid resource naming conflicts. Should only be needed for dev sandbox accounts
  VpcId:
    Type: String
    Description: ID of the VPC where the RDS instance will be deployed
  PrivateSubnet1:
    Type: String
    Description: ID of the first private subnet for the RDS instance
  PrivateSubnet2:
    Type: String
    Description: ID of the second private subnet for the RDS instance
  SecurityGroupId:
    Type: String
    Description: ID of the security group for the RDS instance
  RdsSecurityGroupId:
    Type: String
    Description: ID of the RDS security group for database connections

Conditions:
  IsProd:
    Fn::Equals:
      - !Ref Stage
      - "prod"

Resources:
  CredentialsTableKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Key to encrypt Credentials DynamoDB table
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowRootAccount
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: "kms:*"
            Resource: "*"

  CredentialsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CredentialsTable
      DeletionProtectionEnabled: false
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        KMSMasterKeyId: !Ref CredentialsTableKmsKey
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  CredentialsTableV2:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CredentialsTableV2
      DeletionProtectionEnabled: true
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        KMSMasterKeyId: !Ref CredentialsTableKmsKey
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  BankKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Key to encrypt Bank DynamoDB table
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowRootAccount
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: "kms:*"
            Resource: "*"

  BankTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: BankTable
      DeletionProtectionEnabled: true
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        KMSMasterKeyId: !Ref BankKmsKey
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  TransferKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Key to encrypt Transfer DynamoDB table
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowRootAccount
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: "kms:*"
            Resource: "*"

  TransferTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TransferTable
      DeletionProtectionEnabled: true
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: gsi1Pk
              KeyType: HASH
            - AttributeName: gsi1Sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: gsi2Pk
              KeyType: HASH
            - AttributeName: gsi2Sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1Pk
          AttributeType: S
        - AttributeName: gsi1Sk
          AttributeType: S
        - AttributeName: gsi2Pk
          AttributeType: S
        - AttributeName: gsi2Sk
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        KMSMasterKeyId: !Ref TransferKmsKey
        SSEType: KMS
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  UserKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Key to encrypt Bank DynamoDB table
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowRootAccount
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: "kms:*"
            Resource: "*"

  UserTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: UserTable
      DeletionProtectionEnabled: true
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        KMSMasterKeyId: !Ref UserKmsKey
        SSEType: KMS
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # KMS Key for RDS PostgreSQL instance
  MetadataDBKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Key to encrypt Metadata RDS PostgreSQL instance
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowRootAccount
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowRDSService
            Effect: Allow
            Principal:
              Service: rds.amazonaws.com
            Action:
              - "kms:Encrypt"
              - "kms:Decrypt"
              - "kms:ReEncrypt*"
              - "kms:GenerateDataKey*"
              - "kms:CreateGrant"
              - "kms:ListGrants"
              - "kms:DescribeKey"
            Resource: "*"

  MetadataDBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: 
        Fn::Sub: "Credentials for Metadata RDS PostgreSQL instance - ${Stage}"
      Name:
        Fn::Join:
          - "-"
          - - "metadatadb"
            - "credentials"
            - !Ref Stage
      GenerateSecretString:
        SecretStringTemplate: '{"username":"dbadmin"}'
        GenerateStringKey: "password"
        PasswordLength: 16
        ExcludeCharacters: '"@/\\'
      KmsKeyId: !Ref MetadataDBKmsKey
      Tags:
        - Key: Name
          Value: 
            Fn::Sub: "MetadataDB-Secret-${Stage}"

  MetadataDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "Subnet group for Metadata RDS - ${Stage}"
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  # RDS instance for item/transfer metadata provided by merchants
  MetadataDBInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      EngineVersion: 15.13
      DBInstanceIdentifier: "metadatadb"
      DBName: metadatadb
      MasterUsername: dbadmin
      MasterUserPassword:
        Fn::Join:
          - ''
          - - '{{resolve:secretsmanager:'
            - !Ref MetadataDBSecret
            - ':SecretString:password}}'
      DBInstanceClass:
        Fn::If:
          - IsProd
          - db.t3.medium  # More resources for production (2 vCPU, 4GB RAM)
          - db.t3.micro   # Smaller for non-prod (2 vCPU, 1GB RAM)
      AllocatedStorage:
        Fn::If:
          - IsProd
          - 50  # More storage for production
          - 20  # Less storage for non-prod
      MaxAllocatedStorage:
        Fn::If:
          - IsProd
          - 200  # Higher max storage for production
          - 100  # Lower max storage for non-prod
      StorageType: gp2
      MultiAZ:
        Fn::If:
          - IsProd
          - true   # Enable Multi-AZ for production (higher availability)
          - false  # Disable for non-prod to save costs
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref MetadataDBSubnetGroup
      VPCSecurityGroups:
        - !Ref SecurityGroupId
      BackupRetentionPeriod: 7
      DeleteAutomatedBackups: true
      DeletionProtection:
        Fn::If:
          - IsProd
          - true
          - false
      StorageEncrypted: true
      KmsKeyId: !Ref MetadataDBKmsKey
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot

  SSMInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Path: "/"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  SSMInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: "/"
      Roles:
        - !Ref SSMInstanceRole

  SSMBastionHost:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-0c94855ba95c71c99  # Amazon Linux 2 (update to latest for your region)
      IamInstanceProfile: !Ref SSMInstanceProfile
      SubnetId: !Ref PrivateSubnet1
      SecurityGroupIds:
        - !Ref SecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub "SSM-Bastion-${Stage}"
          
  # RDS Proxy for managing connections to the PostgreSQL instance
  MetadataDBProxyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: rds.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Ref MetadataDBSecret
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !GetAtt MetadataDBKmsKey.Arn

  MetadataDBProxy:
    Type: AWS::RDS::DBProxy
    Properties:
      DBProxyName: !Sub "metadata-db-proxy-${Stage}"
      EngineFamily: POSTGRESQL
      RoleArn: !GetAtt MetadataDBProxyRole.Arn
      Auth:
        - AuthScheme: SECRETS
          SecretArn: !Ref MetadataDBSecret
          IAMAuth: DISABLED
      VpcSubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      VpcSecurityGroupIds:
        - !Ref SecurityGroupId
        - !Ref RdsSecurityGroupId
      RequireTLS: true
      IdleClientTimeout: 1800  # 30 minutes in seconds
      DebugLogging: false

  MetadataDBProxyTargetGroup:
    Type: AWS::RDS::DBProxyTargetGroup
    Properties:
      DBProxyName: !Ref MetadataDBProxy
      TargetGroupName: default
      DBInstanceIdentifiers:
        - !Ref MetadataDBInstance
      ConnectionPoolConfigurationInfo:
        MaxConnectionsPercent: 100
        MaxIdleConnectionsPercent: 50
        ConnectionBorrowTimeout: 120  # 2 minutes in seconds
        SessionPinningFilters: ["EXCLUDE_VARIABLE_SETS"]

  # S3 bucket for storing images with authenticated access
  ImageStorageBucketKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Key to encrypt the image storage S3 bucket
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowRootAccount
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: "kms:*"
            Resource: "*"

  ImageStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "zenobia-image-storage-${Stage}${UniqueIdentifier}"
      AccessControl: Private
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref ImageStorageBucketKmsKey
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
              - HEAD
            AllowedOrigins:
              - "*"
            MaxAge: 3600

  ImageStorageBucketV2:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "zenobia-item-images-${Stage}${UniqueIdentifier}"
      AccessControl: Private
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref ImageStorageBucketKmsKey
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
              - HEAD
            AllowedOrigins:
              - "*"
            MaxAge: 3600

  # IAM Role for Lambda functions to generate pre-signed URLs for the image bucket
  ImageStorageAccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3ImageBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt ImageStorageBucket.Arn
                  - !Sub "${ImageStorageBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt ImageStorageBucketKmsKey.Arn

Outputs:
  CredentialsTableKeyId:
    Value: !Ref CredentialsTableKmsKey
    Description: Credentials key that stores refresh token
  BankKeyId:
    Value: !Ref BankKmsKey
    Description: Bank table that stores plaid credentials
  TransferKeyId:
    Value: !Ref TransferKmsKey
    Description: Bank table that stores plaid credentials
  UserKeyId:
    Value: !Ref UserKmsKey
    Description: Bank table that stores plaid credentials
  CredentialsTableName:
    Value: !Ref CredentialsTableV2
    Description: Table that stores refresh tokens
  BankTableName:
    Value: !Ref BankTable
    Description: Bank table that stores plaid credentials
  TransferTableName:
    Value: !Ref TransferTable
    Description: Transfer table that stores transfer requests and transfer details
  UserTableName:
    Value: !Ref UserTable
    Description: User table that stores additional user metadata
  TransferTableStreamArn:
    Value: !GetAtt TransferTable.StreamArn
  MetadataDBSecret:
    Value: !Ref MetadataDBSecret
    Description: ARN of the secret containing RDS credentials
  MetadataDBProxyEndpoint:
    Value: !GetAtt MetadataDBProxy.Endpoint
    Description: Endpoint of the RDS Proxy for the Metadata database
  MetadataDBEndpoint:
    Value: !GetAtt MetadataDBInstance.Endpoint.Address
    Description: Endpoint of the Metadata RDS instance
  MetadataDBPort:
    Value: !GetAtt MetadataDBInstance.Endpoint.Port
    Description: Port of the Metadata RDS instance
  MetadataDBName:
    Value: metadatadb
    Description: Database name of the Metadata RDS instance
  MetadataDBKmsKeyArn:
    Value: !GetAtt MetadataDBKmsKey.Arn
    Description: ARN of the KMS key used to encrypt the Metadata RDS instance
    Export:
      Name: MetadataDBKmsKeyArn
  ImageStorageBucketName:
    Value: !Ref ImageStorageBucket
    Description: Name of the S3 bucket for storing images
  ImageStorageBucketArn:
    Value: !GetAtt ImageStorageBucket.Arn
    Description: ARN of the S3 bucket for storing images
  ImageStorageBucketKmsKeyArn:
    Value: !GetAtt ImageStorageBucketKmsKey.Arn
    Description: ARN of the KMS key used to encrypt the image storage S3 bucket
  ImageStorageAccessRoleArn:
    Value: !GetAtt ImageStorageAccessRole.Arn
    Description: ARN of the IAM role that can be assumed by Lambda functions to generate pre-signed URLs

