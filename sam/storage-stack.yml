Outputs:
  BankKeyId:
    Value: !Ref BankKmsKey
    Description: Bank table that stores plaid credentials
  TransferKeyId:
    Value: !Ref TransferKmsKey
    Description: Bank table that stores plaid credentials
  UserKeyId:
    Value: !Ref UserKmsKey
    Description: Bank table that stores plaid credentials
  BankTableName:
    Value: !Ref BankTable
    Description: Bank table that stores plaid credentials
  TransferTableName:
    Value: !Ref TransferTable
    Description: Transfer table that stores transfer requests and transfer details
  UserTableName:
    Value: !Ref UserTable
    Description: User table that stores additional user metadata
  TransferTableStreamArn:
    Value: !GetAtt TransferTable.StreamArn

