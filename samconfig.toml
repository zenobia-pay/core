# More information about the configuration file can be found here:
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html
version = 0.1

[default.global.parameters]
stack_name = "zenobia"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = ["CAPABILITY_IAM", "CAPABILITY_AUTO_EXPAND", "CAPABILITY_NAMED_IAM"]
confirm_changeset = true
resolve_s3 = true
s3_prefix = "backend"
region = "us-east-1"
image_repositories = []
parameter_overrides = [
    "UniqueIdentifier=teddy", 
    "Stage=-dev",
    "PlaidSecretsArn=arn:aws:secretsmanager:us-east-1:816069139448:secret:plaid/secrets-9KwgUH",
    "OrumSecretsArn=arn:aws:secretsmanager:us-east-1:816069139448:secret:orum/secrets-JI6xIb",
    "Auth0SecretsArn=arn:aws:secretsmanager:us-east-1:816069139448:secret:auth0/secrets-Zc3U8o",
    "Auth0Domain=dev-iols5y7cp32hlyr1.us.auth0.com"
]

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"
