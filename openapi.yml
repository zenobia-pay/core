openapi: 3.0.1
info:
  title: Zenobia API
  version: 1.0
components:
  securitySchemes:
    SignatureAuthorizer:
      type: apiKey
      name: Signature
      in: header
      x-amazon-apigateway-authtype: custom
      x-amazon-apigateway-authorizer:
        type: request
        authorizerUri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomAuthorizerFunction.Arn}/invocations
        identitySource: method.request.header.Signature
    PlaidSignatureAuthorizer:
      type: apiKey
      name: PlaidSignature
      in: header
      x-amazon-apigateway-authtype: custom
      x-amazon-apigateway-authorizer:
        type: request
        authorizerUri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomAuthorizerFunction.Arn}/invocations
        identitySource: method.request.header.plaid-verification
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Item:
      type: object
      properties:
        itemId:
          type: string
        name:
          type: string
        brandName:
          type: string
        size:
          type: string
        color:
          type: string
        material:
          type: string
        year:
          type: string
        imageUrls:
          type: array
          items:
            type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
    PaymentParticipantIdentity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    TransferStatus:
      type: string
      enum:
        - NOT_STARTED
        - PAID
        - SETTLED
        - FAILED
        - CANCELLED
        - REFUNDED
    StatementItem:
      type: object
      properties:
        itemId:
          type: string
        metadata:
          type: object
          additionalProperties: true
        name:
          type: string
          maxLength: 255
          minLength: 1
        amount:
          type: integer
    Location:
      type: object
      properties:
        address:
          type: string
          maxLength: 255
          minLength: 1
        latitude:
          type: number
        longitude:
          type: number
    UserType:
      type: string
      enum: [MERCHANT, CUSTOMER]
    CertificateType:
      type: string
      enum: [EC]
    SignatureType:
      type: string
      enum: [SHA256_WITH_ECDSA]
    BankAccount:
      type: object
      required:
        - name
      properties:
        bankAccountName:
          type: string
        lastFourDigits:
          type: string
        bankAccountId:
          type: string
x-amazon-apigateway-request-validators:
  basic:
    validateRequestParameters: true
    validateRequestBody: true
x-amazon-apigateway-request-validator: basic
paths:
  /orum-webhook:
    post:
      summary: "Orum webhook endpoint"
      security:
        - SignatureAuthorizer: []
      operationId: "OrumWebhook"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - created_at
                - event_id
                - event_type
                - event_data
              properties:
                created_at:
                  type: string
                event_id:
                  type: string
                event_type:
                  type: string
                event_data:
                  type: object
      responses:
        "200":
          description: "Successful response"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebhookHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /plaid-webhook:
    post:
      summary: "Plaid webhook endpoint"
      security:
        - PlaidSignatureAuthorizer: []
      operationId: "PlaidWebhook"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - webhook_type
                - webhook_code
                - item_id
                - environment
              properties:
                webhook_type:
                  type: string
                webhook_code:
                  type: string
                item_id:
                  type: string
                environment:
                  type: string
                error:
                  type: object
                  properties:
                    error_code:
                      type: string
                    error_message:
                      type: string
                    error_type:
                      type: string
                    status:
                      type: integer
      responses:
        "200":
          description: "Successful response"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebhookHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /issue-jwt:
    post:
      summary: "Exchange refresh token for jwt"
      operationId: "IssueJwt"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
                - sub
              properties:
                refreshToken:
                  type: string
                sub:
                  type: string
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwt:
                    type: string
                  expiresIn:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${JwtIssuerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /create-link-token:
    post:
      summary: "Creates a plaid link token"
      operationId: "CreateLinkToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - product
              properties:
                product:
                  type: string
                  enum:
                    - AUTH
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  linkToken:
                    type: string
                  sub:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BankHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /exchange-token:
    post:
      summary: "Exchanges plaid token"
      operationId: "ExchangeToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sub:
                  type: string
                  maxLength: 255
                linkToken:
                  type: string
                  maxLength: 255
                deviceId:
                  type: string
                  maxLength: 255
                deviceCertificate:
                  type: object
                  properties:
                    certificateType:
                      $ref: "#/components/schemas/CertificateType"
                    certificateValue:
                      type: string
                      maxLength: 3000
                  required:
                    - certificateType
                    - certificateValue
              required:
                - linkToken
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  refreshToken:
                    type: string
                  sub:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-request-validator: body
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BankHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /list-bank-accounts:
    post:
      summary: "Lists all bank accounts associated with account"
      operationId: "ListBankAccounts"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                  maxLength: 255
                  minLength: 1
                continuationToken:
                  type: string
                  maxLength: 512
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  continuationToken:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BankAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BankHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /delete-bank-account:
    post:
      summary: "Deletes a bank account."
      operationId: "DeleteBankAccount"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - bankAccountId
              properties:
                deviceId:
                  type: string
                  maxLength: 255
                bankAccountId:
                  type: string
                  maxLength: 255
                  minLength: 1
      responses:
        "200":
          description: "Successful response"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BankHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /delete-refresh-token:
    post:
      summary: "Deletes refresh token"
      operationId: "DeleteRefreshToken"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  maxLength: 255
      responses:
        "200":
          description: "Successful response"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BankHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /create-transfer-request:
    post:
      summary: "Creates a request for payment (merchant side)"
      operationId: "CreateTransferRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                statementItems:
                  type: array
                  items:
                    $ref: "#/components/schemas/StatementItem"
                expirySeconds:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                transferMetadata:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  transferRequestId:
                    type: string
                  merchantId:
                    type: string
                  expiry:
                    type: integer
                  signature:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /fulfill-transfer:
    post:
      summary: "Fulfill transfer request (customer side)"
      operationId: "FulfillTransfer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - transferRequestId
                - bankAccountId
                - deviceId
                - signature
              properties:
                transferRequestId:
                  type: string
                  maxLength: 255
                bankAccountId:
                  type: string
                  maxLength: 255
                deviceId:
                  type: string
                  maxLength: 255
                signature:
                  type: object
                  properties:
                    signatureType:
                      $ref: "#/components/schemas/SignatureType"
                    signatureValue:
                      maxLength: 1000
                      type: string
                  required:
                    - signatureType
                    - signatureValue
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  amount:
                    type: integer
                  merchant:
                    $ref: "#/components/schemas/PaymentParticipantIdentity"
                  statementItems:
                    type: array
                    items:
                      $ref: "#/components/schemas/StatementItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /get-customer-transfer:
    get:
      summary: "Fetches metadata associated with a merchant's transfer request"
      operationId: "GetCustomerTransfer"
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  amount:
                    type: integer
                  transferRequestId:
                    type: string
                  merchant:
                    $ref: "#/components/schemas/PaymentParticipantIdentity"
                  status:
                    $ref: "#/components/schemas/TransferStatus"
                  statementItems:
                    type: array
                    items:
                      $ref: "#/components/schemas/StatementItem"
                  statusMessage:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /get-merchant-transfer:
    get:
      summary: "Fetches metadata associated with a merchant's transfer request"
      operationId: "GetMerchantTransfer"
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  transferRequestId:
                    type: string
                  amount:
                    type: integer
                  status:
                    $ref: "#/components/schemas/TransferStatus"
                  statementItems:
                    type: array
                    items:
                      $ref: "#/components/schemas/StatementItem"
                  statusMessage:
                    type: string
                  customerName:
                    type: string
                  fee:
                    type: integer
                  payoutTime:
                    type: string
                  creationTime:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /list-customer-transfers:
    post:
      summary: "Lists all transfers made with customer account"
      operationId: "ListCustomerTransfers"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                continuationToken:
                  type: string
                  minLength: 1
                  maxLength: 512
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  continuationToken:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        transferRequestId:
                          type: string
                        amount:
                          type: integer
                        creationTime:
                          type: string
                        status:
                          $ref: "#/components/schemas/TransferStatus"
                        merchant:
                          $ref: "#/components/schemas/PaymentParticipantIdentity"
                        customerBankAccount:
                          $ref: "#/components/schemas/BankAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /list-merchant-transfers:
    post:
      summary: "Lists all transfers made to a merchant account"
      operationId: "ListMerchantTransfers"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                continuationToken:
                  type: string
                  minLength: 1
                  maxLength: 512
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  continuationToken:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        amount:
                          type: integer
                        status:
                          type: string
                        transferRequestId:
                          type: string
                        customerName:
                          type: string
                        fee:
                          type: integer
                        payoutTime:
                          type: string
                        creationTime:
                          type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /edit-transfer:
    post:
      summary: "Edits a transfer. Can retry and refund"
      operationId: "EditTransfer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - transferRequestId
              properties:
                transferRequestId:
                  type: string
                  maxLength: 255
                debitCustomer:
                  type: boolean
                  default: false
                debitMerchant:
                  type: boolean
                  default: false
                creditCustomer:
                  type: boolean
                  default: false
                creditMerchant:
                  type: boolean
                  default: false
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  amount:
                    type: integer
                  merchant:
                    $ref: "#/components/schemas/PaymentParticipantIdentity"
                  statementItems:
                    type: array
                    items:
                      $ref: "#/components/schemas/StatementItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /list-merchant-payouts:
    post:
      summary: "Lists all payouts for a merchant"
      operationId: "ListMerchantPayouts"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                continuationToken:
                  type: string
                  minLength: 1
                  maxLength: 512
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  continuationToken:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        amount:
                          type: integer
                        fee:
                          type: integer
                        status:
                          type: string
                          enum:
                            - PENDING
                            - PAID
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /mark-in-dispute:
    post:
      summary: "Mark a transfer in dispute"
      operationId: "MarkInDispute"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                transferRequestId:
                  type: string
      responses:
        "200":
          description: "Successful response"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /get-transfer-statistics:
    post:
      summary: "Get aggregated transfer statistics"
      operationId: "GetTransferStatistics"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                startTime:
                  type: string
                endTime:
                  type: string
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  amountPaid:
                    type: integer
                  amountSettled:
                    type: integer
                  fee:
                    type: integer
                  transferCount:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
