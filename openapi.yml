openapi: 3.0.1
info:
  title: Zenobia API
  version: 1.0
components:
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
    PaymentParticipantIdentity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    TransferStatus:
      type: string
      enum:
        - NOT_STARTED
        - IN_FLIGHT
        - COMPLETED
        - FAILED
        - CANCELLED
    StatementItem:
      type: object
      properties:
        name:
          type: string
        amount:
          type: integer
    Location:
      type: object
      properties:
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
    UserType:
      type: string
      enum: [MERCHANT, CUSTOMER]
    CertificateType:
      type: string
      enum: [EC]
    SignatureType:
      type: string
      enum: [SHA256_WITH_ECDSA]
    Address:
      type: object
      required:
        - address1
        - city
        - state
        - country
        - zip5
      properties:
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
          enum: [US]
        zip5:
          type: string
x-amazon-apigateway-request-validators:
  basic:
    validateRequestParameters: true
    validateRequestBody: true
x-amazon-apigateway-request-validator: basic
paths:
  /create-link-token:
    post:
      summary: "Creates a plaid link token"
      operationId: "CreateLinkToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - product
              properties:
                product:
                  type: string
                  enum:
                    - AUTH
                    - IDENTITY_VERIFICATION
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  linkToken:
                    type: string
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BankHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /exchange-token:
    post:
      summary: "Exchanges plaid token"
      operationId: "ExchangeToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                linkToken:
                  type: string
                deviceId:
                  type: string
                deviceCertificate:
                  type: object
                  properties:
                    certificateType:
                      $ref: "#/components/schemas/CertificateType"
                    certificateValue: # in base64
                      type: string
                  required:
                    - certificateType
                    - certificateValue
              required:
                - linkToken
      responses:
        '200':
          description: "Successful response"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-request-validator: body
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BankHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /list-bank-accounts:
    post:
      summary: "Lists all bank accounts associated with account"
      operationId: "ListBankAccounts"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                continuationToken:
                  type: string
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  continuationToken:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        bankAccountId:
                          type: string
                        bankAccountName:
                          type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BankHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /create-transfer-request:
    post:
      summary: "Creates a request for payment (merchant side)"
      operationId: "CreateTransferRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                statementItems:
                  type: array
                  items:
                    $ref: "#/components/schemas/StatementItem"
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  transferRequestId:
                    type: string
                  merchantId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /fulfill-transfer:
    post:
      summary: "Fulfill transfer request (customer side)"
      operationId: "FulfillTransfer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - transferRequestId
                - merchantId
                - bankAccountId
                - deviceId
                - signature
              properties:
                transferRequestId:
                  type: string
                merchantId:
                  type: string
                bankAccountId:
                  type: string
                deviceId:
                  type: string
                signature:
                  type: object
                  properties:
                    signatureType:
                      $ref: "#/components/schemas/SignatureType"
                    signatureValue:
                      type: string
                  required:
                    - signatureType
                    - signatureValue
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  amount:
                    type: integer
                  merchant:
                    $ref: "#/components/schemas/PaymentParticipantIdentity"
                  statementItems:
                    type: array
                    items:
                      $ref: "#/components/schemas/StatementItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /get-merchant-transfer:
    get:
      summary: "Fetches metadata associated with a merchant's transfer request"
      operationId: "GetMerchantTransfer"
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  transferRequestId:
                    type: string
                  merchant:
                    $ref: "#/components/schemas/PaymentParticipantIdentity"
                  status:
                    $ref: "#/components/schemas/TransferStatus"
                  statementItems:
                    type: array
                    items:
                      $ref: "#/components/schemas/StatementItem"
                  statusMessage:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /list-customer-transfers:
    post:
      summary: "Lists all transfers made with customer account"
      operationId: "ListCustomerTransfers"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                continuationToken:
                  type: string
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  continuationToken:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        amount:
                          type: integer
                        creationTime:
                          type: string
                        status:
                          $ref: "#/components/schemas/TransferStatus"
                        merchant:
                          $ref: "#/components/schemas/PaymentParticipantIdentity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /list-merchant-transfers:
    post:
      summary: "Lists all transfers made to a merchant account"
      operationId: "ListMerchantTransfers"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                continuationToken:
                  type: string
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  continuationToken:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        amount:
                          type: integer
                        status:
                          type: string
                        transferRequestId:
                          type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /get-merchant-config:
    get:
      summary: "Fetches metadata associated with a merchant"
      operationId: "GetMerchantConfig"
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  bankAccountId:
                    type: string
                  merchantDisplayName:
                    type: string
                  merchantDescription:
                    type: string
                  webhookUrl:
                    type: string
                  merchantLocation:
                    $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /update-merchant-config:
    post:
      summary: "Update merchant configuration"
      operationId: "UpdateMerchantConfig"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bankAccountId:
                  type: string
                merchantDisplayName:
                  type: string
                merchantDescription:
                  type: string
                webhookUrl:
                  type: string
                merchantLocation:
                  $ref: "#/components/schemas/Location"
      responses:
        '200':
          description: "Successful response"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /submit-customer-onboarding:
    post:
      summary: "Onboards a customer, adding user metadata. Only called on first login."
      operationId: "SubmitCustomerOnboarding"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identityVerificationId
              properties:
                identityVerificationId:
                  type: string
      responses:
        '200':
          description: "Successful response"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /submit-merchant-onboarding:
    post:
      summary: "Onboards a merchant, adding user metadata and merchant info. Only called on first login."
      operationId: "SubmitMerchantOnboarding"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - merchantDisplayName
                - legalBusinessName
                - entityType
                - taxId
                - taxIdType
                - incorporationDate
                - address
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                merchantDisplayName:
                  type: string
                legalBusinessName:
                  type: string
                entityType:
                  type: string
                  enum:
                    - SOLE_PROPRIETORSHIP
                    - PARTNERSHIP
                    - LLP
                    - LLC
                    - C_CORP
                    - S_CORP
                    - B_CORP
                    - NON_PROFIT
                taxId:
                  type: string
                  pattern: '^\d{9}$'
                taxIdType:
                  type: string
                  enum:
                    - TIN
                    - EIN
                incorporationDate:
                  type: string
                  pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
                address:
                  $ref: '#/components/schemas/Address'
      responses:
        '200':
          description: "Successful response"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /get-user-profile:
    get:
      summary: "Fetches user profile, including onboarding status, user type, etc"
      operationId: "GetUserProfile"
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasOnboarded:
                    type: boolean
                  userType:
                    $ref: '#/components/schemas/UserType'
                  isApproved:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /create-m2m-credentials:
    get:
      summary: "Creates m2m credentials for a merchant"
      operationId: "CreateM2mCredentials"
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientId:
                    type: string
                  clientSecret:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /list-m2m-credentials:
    post:
      summary: "Lists m2m credentials. Only returns client id"
      operationId: "ListM2MCredentials"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                continuationToken:
                  type: string
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  credentials:
                    type: array
                    items:
                      type: object
                      properties:
                        clientId:
                          type: string
                  continuationToken:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /delete-m2m-credentials:
    post:
      summary: "Deletes m2m credentials."
      operationId: "DeleteM2MCredentials"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clientId
              properties:
                clientId:
                  type: string
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
