openapi: 3.0.1
info:
  title: Zenobia API
  version: 1.0
components:
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
    PaymentParticipantIdentity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    TransferStatus:
      type: string
      enum:
        - NOT_STARTED
        - IN_FLIGHT
        - COMPLETED
        - FAILED
        - CANCELLED
    StatementItem:
      type: object
      properties:
        name:
          type: string
        amount:
          type: integer
    Location:
      type: object
      properties:
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
    UserType:
      type: string
      enum: [MERCHANT, CUSTOMER, UNKNOWN]
    CertificateType:
      type: string
      enum: [EC]
    SignatureType:
      type: string
      enum: [SHA256_WITH_ECDSA]
x-amazon-apigateway-request-validators:
  basic:
    validateRequestParameters: true
    validateRequestBody: true
x-amazon-apigateway-request-validator: basic
paths:
  /create-link-token:
    get:
      summary: "Creates a plaid link token"
      operationId: "CreateLinkToken"
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  linkToken:
                    type: string
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BankHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /exchange-token:
    post:
      summary: "Exchanges plaid token"
      operationId: "ExchangeToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                linkToken:
                  type: string
                deviceId:
                  type: string
                deviceCertificate:
                  type: object
                  properties:
                    certificateType:
                      $ref: "#/components/schemas/CertificateType"
                    certificate: # in base64
                      type: string
              required:
                - linkToken
      responses:
        '200':
          description: "Successful response"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-request-validator: body
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BankHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /list-bank-accounts:
    post:
      summary: "Lists all bank accounts associated with account"
      operationId: "ListBankAccounts"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  continuationToken:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        bankAccountId:
                          type: string
                        bankAccountName:
                          type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BankHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /create-transfer-request:
    post:
      summary: "Creates a request for payment (merchant side)"
      operationId: "CreateTransferRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - bankAccountId
              properties:
                amount:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                bankAccountId:
                  type: string
                statementItems:
                  type: array
                  items:
                    $ref: "#/components/schemas/StatementItem"
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  transferRequestId:
                    type: string
                  merchantId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /fulfill-transfer:
    post:
      summary: "Fulfill transfer request (customer side)"
      operationId: "FulfillTransfer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - transferRequestId
                - merchantId
                - bankAccountId
                # TODO: device and signature should be required
              properties:
                transferRequestId:
                  type: string
                merchantId:
                  type: string
                bankAccountId:
                  type: string
                deviceId:
                  type: string
                signature:
                  type: object
                  properties:
                    signatureType:
                      $ref: "#/components/schemas/SignatureType"
                    data:
                      type: string
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  amount:
                    type: integer
                  merchant:
                    $ref: "#/components/schemas/PaymentParticipantIdentity"
                  statementItems:
                    type: array
                    items:
                      $ref: "#/components/schemas/StatementItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /get-merchant-transfer:
    get:
      summary: "Fetches metadata associated with a merchant's transfer request"
      operationId: "GetMerchantTransfer"
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  transferRequestId:
                    type: string
                  merchant:
                    $ref: "#/components/schemas/PaymentParticipantIdentity"
                  status:
                    $ref: "#/components/schemas/TransferStatus"
                  statementItems:
                    type: array
                    items:
                      $ref: "#/components/schemas/StatementItem"
                  statusMessage:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /list-customer-transfers:
    get:
      summary: "Lists all transfers made with customer account"
      operationId: "ListCustomerTransfers"
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  continuationToken:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        amount:
                          type: integer
                        creationTime:
                          type: string
                        status:
                          $ref: "#/components/schemas/TransferStatus"
                        merchant:
                          $ref: "#/components/schemas/PaymentParticipantIdentity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /list-merchant-transfers:
    get:
      summary: "Lists all transfers made to a merchant account"
      operationId: "ListMerchantTransfers"
      parameters:
        - name: continuationToken
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  continuationToken:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        amount:
                          type: integer
                        status:
                          type: string
                        transferRequestId:
                          type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TransferHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /get-merchant-config:
    get:
      summary: "Fetches metadata associated with a merchant"
      operationId: "GetMerchantConfig"
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  bankAccountId:
                    type: string
                  merchantDisplayName:
                    type: string
                  merchantDescription:
                    type: string
                  webhookUrl:
                    type: string
                  merchantLocation:
                    $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /update-merchant-config:
    post:
      summary: "Update merchant configuration"
      operationId: "UpdateMerchantConfig"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bankAccountId:
                  type: string
                merchantDisplayName:
                  type: string
                merchantDescription:
                  type: string
                webhookUrl:
                  type: string
                merchantLocation:
                  $ref: "#/components/schemas/Location"
      responses:
        '200':
          description: "Successful response"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /submit-onboarding:
    post:
      summary: "Onboards a user, adding user metadata and merchant info (if applicable). Only called on first login."
      operationId: "SubmitOnboarding"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - userType
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                merchantDisplayName:
                  type: string
                userType:
                  $ref: '#/components/schemas/UserType'
      responses:
        '200':
          description: "Successful response"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /get-user-profile:
    get:
      summary: "Fetches user profile, including onboarding status, user type, etc"
      operationId: "GetUserProfile"
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasOnboarded:
                    type: boolean
                  userType:
                    $ref: '#/components/schemas/UserType'
                  isApproved:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
  /create-m2m-credentials:
    get:
      summary: "Creates m2m credentials for a merchant"
      operationId: "CreateM2mCredentials"
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientId:
                    type: string
                  clientSecret:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${M2MHandlerFunction.Arn}:prod/invocations
        httpMethod: POST
        type: aws_proxy
